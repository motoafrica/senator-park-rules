rson from among their number and that replacement chairperson has all the powers and functions of the chairperson while acting as such."]]}, {"n": 14, "title": "Quorum", "part": "Trustee Meetings and Decisions", "partNo": 3, "paras": [[1, "(1)", "At a trustee meeting, 50 per cent of the trustees by number form a quorum."], [1, "(2)", "If the number of trustees falls below the number necessary to form a quorum, the remaining trustee or trustees may continue to act, but only to —"], [2, "(a)", "appoint replacement trustees to make up a quorum; or"], [2, "(b)", "call a general meeting."], [1, "(3)", "If at any trustee meeting a quorum is not present within 30 minutes of the appointed time for the meeting, the trustees present, but not less than two, must adopt interim resolutions in respect of each item on the agenda."], [1, "(4)", "An interim resolution adopted by trustees in terms of sub-rule (3) does not take effect unless it is confirmed —"], [2, "(a)", "at the next trustee meeting at which a quorum is present; or"], [2, "(b)", "by written resolution signed by all the trustees."]]}, {"n": 15, "title": "Voting", "part": "Trustee Meetings and Decisions", "partNo": 3, "paras": [[1, "(1)", "A motion at a trustee meeting —"], [2, "(a)", "does not have to be seconded; and"], [2, "(b)", "must be determined by resolution adopted by the majority of the trustees present and voting."], [1, "(2)", "Each trustee is entitled to one vote; provided that if the deliberative votes of the trustees, including that of the chairperson, are tied, the chairperson has a casting vote."], [1, "(3)", "A trustee is disqualified from voting in respect of any matter in which the trustee has any direct or indirect personal interest."], [1, "(4)", "Trustees must adopt decisions by resolutions adopted by majority vote: Provided that resolutions may be put to the vote —"], [2, "(a)", "at trustee meetings; or"], [2, "(b)", "by a notice sent to each trustee which contains the text of any proposed resolutions and instructs the trustees to indicate their agreement to the resolution by their signature, which must be received by the body corporate before expiry of the closing date specified in the notice."]]}, {"n": 16, "title": "Mandatory first actions of new trustees", "part": "Trustee Meetings and Decisions", "partNo": 3, "paras": [[1, "(1)", "Every new trustee must be provided with a physical copy of the Act and the management and conduct rules of the body corporate at the meeting where they were elected or co-opted."], [1, "(2)", "If a new board of trustees were elected at an annual general meeting, the trustees must, within 14 days of the budgets being approved by the members at the annual general meeting, calculate the member contributions and charges due and send out a written notice to each member in accordance with rule 27(1)."], [1, "(3)", "In order to meet the requirements of sub-rule (2), the trustees must first pass written resolutions that confirm:"], [2, "(a)", "the amounts and future instalment period for contributions; and"], [2, "(b)", "the interest rate applicable to contribution arrears, even if these remain the same as before the annual general meeting."], [1, "(4)", "At the first trustees’ meeting after an annual general meeting, the trustees must take the following actions (which must be confirmed in the minutes of the meeting):"], [2, "(a)", "elect a chairperson at the commencement of the meeting in terms of rule 13(1);"], [2, "(b)", "sign a written confirmation that they have read and understand the Act and the rules;"], [2, "(c)", "familiarise themselves with the maintenance plan that was approved at the annual general meeting and set tasks in relation to this plan if necessary;"], [2, "(d)", "familiarise themselves with the insurance policy of the body corporate and confirm that it meets the requirements set out in rule 25;"], [2, "(e)", "review all contracts to which the body corporate is a party and, in particular, take note of the contracts’ obligations, dates, cost-implications and termination clauses;"], [2, "(f)", "review the minutes of the annual general meeting and set tasks accordingly;"], [2, "(g)", "arrange for all trustees to do a building walk-through, accompanied by the managing agent and/or the building manager or caretaker;"], [2, "(h)", "decide on a preferred monthly day and time for future trustee meetings."]]}, {"n": 17, "title": "Mandatory monthly actions of the board of trustees", "part": "Trustee Meetings and Decisions", "partNo": 3, "paras": [[1, "", "In their capacity as the supervisors of the body corporate’s agents and employees, the trustees must confirm monthly supervisory checks at their meetings and, in particular, they must —"], [2, "(a)", "check the bank statements of the body corporate accounts and confirm that the monthly financial summaries produced by the managing agent are accurate;"], [2, "(b)", "check income from the past month and confirm amounts received and in arrears;"], [2, "(c)", "confirm that all income for the previous month was disbursed to the administrative and reserve funds in accordance with rule 26(3);"], [2, "(d)", "confirm that any money paid out of the administrative fund during the previous month was done in accordance with rule 26(4);"], [2, "(e)", "confirm that any money paid out of the reserve fund during the previous month was done in accordance with rules 26(5) and 26(6);"], [2, "(f)", "confirm that expenses from the previous month did not exceeded the amounts that were authorised by the members of the body corporate in the approved budgets;"], [2, "(g)", "check the monthly report produced by the building manager or caretaker; and"], [2, "(h)", "if any irregularities or problems are uncovered in these mandatory monthly checks, decide on appropriate steps to investigate and rectify them."]]}, {"n": 18, "title": "Notice", "part": "Owner Meetings", "partNo": 4, "paras": [[1, "(1)", "Subject to sub-rule (7), at least 14 days’ written notice of a general meeting specifying the place, date and hour of the meeting must be given to —"], [2, "(a)", "all members;"], [2, "(b)", "all registered bondholders;"], [2, "(c)", "all holders of future development rights; and"], [2, "(d)", "the managing agent."], [1, "(2)", "A person who has a right to be notified under this rule may waive that right by notice in writing delivered to the body corporate and may, at any time and in the same way, revoke that waiver; provided that if two or more persons are jointly entitled to exercise a vote, all of them must waive the right to notice and any of them may revoke that waiver."], [1, "(3)", "The notice of a general meeting must be accompanied by at least —"], [2, "(a)", "an agenda, as required in terms of these rules;"], [2, "(b)", "a copy or comprehensive summary of any document that is to be considered or approved by members at the meeting; and"], [2, "(c)", "a proxy appointment form in the prescribed format."], [1, "(4)", "A general meeting must be held in the local municipal area where the scheme is situated unless the members have by special resolution decided otherwise."], [1, "(5)", "Registered bondholders, holders of future development rights and the managing agent may attend general meetings and may speak on any matter on the agenda, but they are not, in those capacities, entitled to propose any motion or to vote; provided that such persons are not entitled to attend any part of a general meeting if the members resolve that their presence would unreasonably interfere with the interests of the body corporate or any person’s privacy."], [1, "(6)", "Notice of a general meeting must be delivered to —"], [2, "(a)", "members at their service addresses in terms of rule 4(5), and"], [2, "(b)", "other persons at the most recent physical, postal, fax or email address of which they have notified the body corporate in writing."], [1, "(7)", "A general meeting may be called —"], [2, "(a)", "on 7 days’ notice if the trustees have resolved that short notice is necessary due to the urgency of the matter and set out their reasons for this resolution; provided that the trustees must not take such a resolution in regard to a meeting referred to in rule 31(2) or 31(4);"], [2, "(b)", "on less than 14 days’ notice, if this is agreed to in writing by all persons entitled to attend."], [1, "(8)", "Failure to give proper notice of a general meeting to a person entitled to receive notice does not invalidate a vote taken at the meeting, as long as the body corporate made a reasonable attempt to give the notice."], [1, "(9)", "Voting at a general meeting may proceed despite the lack of notice as required by this rule, if all persons entitled to receive notice in writing waive their right to notice."]]}, {"n": 19, "title": "Annual and special general meetings", "part": "Owner Meetings", "partNo": 4, "paras": [[1, "(1)", "Subject to sub-rule (2), the body corporate must hold an annual general meeting within four months of the end of each financial year."], [1, "(2)", "The body corporate is not obliged to hold an annual general meeting if, before or within one month of the end of a financial year, all members in writing waive the right to the meeting and consent in writing to motions that deal with all the items of business that must be transacted at the annual general meeting; provided that if two or more persons are jointly entitled to exercise a vote, all of them must waive the right to the meeting and consent to the resolutions in writing."], [1, "(3)", "All general meetings other than the annual general meeting are special general meetings."], [1, "(4)", "The trustees may by resolution call a general meeting whenever they think fit and must do so if either —"], [2, "(a)", "members entitled to 25 per cent of the total quotas of all sections; or"], [2, "(b)", "the holder of mortgage bonds over not less than 25 per cent in number of all the primary sections, deliver to the body corporate a written and signed request for a special general meeting; provided that if the trustees fail to call a meeting thus requested within 14 days of delivery of the request, the members or bondholder concerned are entitled to call the meeting."], [1, "(5)", "Members or a bondholder who request a meeting in terms of sub-rule (4) must include one or more motions or matters for discussion with their request and these motions or matters must be included, without amendment, in the agenda for the meeting."], [1, "(6)", "The order of business at general meetings is as follows:"], [2, "(a)", "confirm proxies, nominees and other persons representing members and issue voting cards;"], [2, "(b)", "determine that there is a quorum;"], [2, "(c)", "elect a person to chair the meeting, if necessary;"], [2, "(d)", "present to the meeting proof of notice of the meeting or waivers of notice;"], [2, "(e)", "approve the agenda;"], [2, "(f)", "approve minutes from the previous general meeting;"], [2, "(g)", "deal with unfinished business, if any;"], [2, "(h)", "deal with any business referred to in sub-rule (5);"], [2, "(i)", "if the meeting is an annual general meeting:"], [3, "(i)", "receive reports of the activities and decisions of trustees since the previous general meeting, including reports of committees;"], [3, "(ii)", "approve the schedules of insurance replacement values referred to in rule 25(3), with or without amendment;"], [3, "(iii)", "determine the extent of the insurance cover by the body corporate in terms of rules 25(6), (7) and (8);"], [3, "(iv)", "approve the budgets for the administrative and reserve funds for the next financial year;"], [3, "(v)", "consider the annual financial statements;"], [3, "(vi)", "appoint an auditor to audit the annual financial statements;"], [3, "(vii)", "determine the number of trustees to be elected to serve during the next financial year; and"], [3, "(viii)", "elect the trustees;"], [2, "(j)", "report on the lodgement of any amendments to the scheme’s rules adopted by the body corporate under section 10 of the Act and, if applicable, table a consolidated set of scheme rules;"], [2, "(k)", "deal with any new or further business;"], [2, "(l)", "give directions or impose restrictions referred to in section 7(1) of the Act; and"], [2, "(m)", "dissolve the meeting."], [1, "(7)", "Subject to sub-rules (5) and (6), the trustees determine the agenda for an annual or special general meeting; provided that the agenda must contain —"], [2, "(a)", "a description of the general nature of all business; and"], [2, "(b)", "a description of the matters that will be voted on at the meeting, including the proposed wording of any special or unanimous resolution."], [1, "(8)", "If any of the items of business that require member approval are not approved at an annual general meeting or any adjournment of the meeting; the resolution not to approve the relevant document must include the reasons for non-approval and the body corporate must have the document revised and submitted to another general meeting for approval as soon as reasonably possible, until it is approved."], [1, "(9)", "The body corporate does not have to hold a special general meeting to consider a resolution if all members waive the right to the meeting and consent to the resolution in writing; provided that if two or more persons are jointly entitled to exercise a vote, all of them must waive the right to the meeting and consent to the resolution in writing."], [1, "(10)", "A body corporate may make arrangements for attendance at an annual or special general meeting by telephone or any other method, if the method —"], [2, "(a)", "is accessible to all members and other persons entitled to attend the meeting;"], [2, "(b)", "permits all persons participating in the meeting to communicate with each other during the meeting; and"], [2, "(c)", "permits the chairperson to confirm, with reasonable certainty, the identity of the participants."], [1, "(11)", "A person who attends a meeting as provided under sub-rule (10) is considered present in person at the meeting."]]}, {"n": 20, "title": "Chairperson", "part": "Owner Meetings", "partNo": 4, "paras": [[1, "(1)", "The chairperson of the trustees must preside as chairperson at every general meeting of the body corporate, unless otherwise resolved by members at the meeting."], [1, "(2)", "If there is no chairperson or the chairperson of the trustees is not present within 15 minutes after the time appointed for the meeting, or is unwilling or unable to act as chairperson, the members present must elect a chairperson for such meeting."], [1, "(3)", "A chairperson must —"], [2, "(a)", "maintain order, regulate the orderly expression of views and guide the members and other participants through the business of the meeting in accordance with the common law of meetings;"], [2, "(b)", "ensure that all motions and amendments proposed are within the scope of the notice and powers of the meeting;"], [2, "(c)", "ensure that the scheme’s rules, the minute books and any other documents relevant to the items of business on the agenda are available at the meeting;"], [2, "(d)", "act fairly, impartially and courteously to all members and others entitled to attend the meeting;"], [2, "(e)", "ensure that all members and other persons entitled to speak are able to express their views without unnecessary disturbance or interruption;"], [2, "(f)", "adjourn the meeting, when it is not able to complete or continue with its business;"], [2, "(g)", "make decisions on points of procedure;"], [2, "(h)", "settle disputes by giving rulings on points of order; and"], [2, "(i)", "surrender the chair to a temporary chairperson elected by the members for any period during which the chairperson wishes to engage in the debate of any item of business."], [1, "(4)", "A chairperson at a general meeting must not —"], [2, "(a)", "from the chair, attempt to influence members’ views on any item of business; or"], [2, "(b)", "disclose in advance of a vote how the chairperson intends to vote on any item of business."]]}, {"n": 21, "title": "Quorum", "part": "Owner Meetings", "partNo": 4, "paras": [[1, "(1)", "Business must not be transacted at any general meeting unless a quorum is present or represented."], [1, "(2)", "A quorum for a general meeting is constituted by members entitled to vote and holding one third of the total votes of members in value, provided that at least two persons must be present unless all the sections in the scheme are registered in the name of one person."], [1, "(3)", "For the purpose of establishing a quorum and for the purposes of section 6 of the Act, the value of votes of any sections registered in the name of the body corporate must not be taken into account and the body corporate must not be considered to be a member."], [1, "(4)", "If within 30 minutes from the time appointed for a general meeting a quorum is not present, the meeting stands adjourned to the same day in the next week at the same place and time; provided that if on the day to which the meeting is adjourned a quorum as described in sub-rule (2) is not present within 30 minutes from the time appointed for the meeting, the members entitled to vote and present in person or by proxy constitute a quorum."]]}, {"n": 22, "title": "Voting and representatives", "part": "Owner Meetings", "partNo": 4, "paras": [[1, "(1)", "A motion at a general meeting —"], [2, "(a)", "does not need to be seconded; and"], [2, "(b)", "except for a special or unanimous resolution, must be adopted by resolution of the majority of the votes, calculated in value, of the members present and voting."], [1, "(2)", "Except for special and unanimous resolutions, a member is not entitled to vote if —"], [2, "(a)", "they fail or refuse to pay the body corporate any amount due by them after a court or adjudicator has given a judgment or order for payment of the outstanding amount; or"], [2, "(b)", "they persist in the breach of any of the conduct rules of the scheme referred to in section 10(2)(b) of the Act after a court or an adjudicator has ordered the member to refrain from breaching such rule."], [1, "(3)", "For the purposes of any vote, the values of votes of any sections registered in the name of the body corporate are considered abstentions."], [1, "(4)", "Where a member is as such a trustee for a beneficiary, that member exercises voting rights to the exclusion of persons beneficially interested in the trust and such persons are not entitled to vote."], [1, "(5)", "A member’s appointment of a proxy in terms of section 6(5) of the Act and the proxy’s acceptance of the mandate must, except in the case of an appointment in a mortgage bond, be substantially in the prescribed form and must be —"], [2, "(a)", "delivered to the body corporate 48 hours before the time of the meeting; or"], [2, "(b)", "handed to the chairperson before or at the start of the meeting."], [1, "(6)", "A proxy need not be a member, but must not be the managing agent or an employee of the managing agent or the body corporate."], [1, "(7)", "When two or more persons are entitled to exercise one vote jointly, that vote may be exercised only by one person, who may or may not be one of them, jointly appointed by them as their proxy."], [1, "(8)", "The outcome of each vote, including the number of votes for and against the resolution, must be announced by the chairperson and recorded in the minutes of the meeting."], [1, "(9)", "If a special resolution is passed at a general meeting by members holding less than 50 per cent of the total value of all members’ votes —"], [2, "(a)", "the body corporate must not take any action to implement that resolution for one week after the meeting, unless the trustees resolve that there are reasonable grounds to believe that immediate action is necessary to ensure safety or prevent significant loss or damage to the scheme; and"], [2, "(b)", "within seven days from a resolution referred to in sub-rule (9)(a), members holding at least 25 per cent of the total votes of all members in value may, by written and signed request delivered to the body corporate, require that the body corporate hold a special general meeting to reconsider the resolution."], [1, "(10)", "If a demand referred to in sub-rule (9)(b) is delivered to the body corporate, the trustees must not implement the resolution unless —"], [2, "(a)", "it is again passed by special resolution; or"], [2, "(b)", "a quorum is not present within 30 minutes of the time set for the meeting."]]}, {"n": 23, "title": "Financial year, functions and powers", "part": "Financial Management", "partNo": 5, "paras": [[1, "(1)", "The financial year of the body corporate must run from the first day of January of each year to the last day of December of the same year, unless otherwise resolved by the body corporate in general meeting."], [1, "(2)", "The body corporate must not —"], [2, "(a)", "make loans from body corporate funds without the authority of a unanimous resolution;"], [2, "(b)", "refund to any member a contribution lawfully levied and paid;"], [2, "(c)", "distribute to a member or any other person any portion of the body corporate’s profits or gains except —"], [3, "(i)", "upon destruction or deemed destruction of the buildings, or"], [3, "(ii)", "where such profit or gain is of a capital nature."], [1, "(3)", "The body corporate may, on the authority of a written trustee resolution —"], [2, "(a)", "levy members with a special contribution if additional income is required to meet a necessary expense that cannot reasonably be delayed until provided for in the budget for the next financial year;"], [2, "(b)", "increase the contributions due by the members by a maximum of 10 per cent at the end of a financial year to take account of the anticipated increased liabilities of the body corporate, which increase will remain effective until members receive notice of the contributions due by them for the next financial year; provided that the trustees must give members notice of such increased contributions by notice in terms of rule 26, with such changes as are required by the context;"], [2, "(c)", "charge interest on any overdue amount payable by a member to the body corporate; provided that the interest rate must not exceed the maximum rate of interest payable per annum under the National Credit Act (Act No 34 of 2005), compounded monthly in arrear;"], [2, "(d)", "invest any moneys in the reserve fund referred to in sections 3(1)(b) of the Act in a secure investment with any institution referred to in the definition of “financial institution” in section 1 of the Financial Services Board Act, 1990 (Act No. 97 of 1990);"], [2, "(e)", "enter into written and signed contracts in respect of its powers and duties under the Act and these rules;"], [2, "(f)", "join organisations and subscribe to services to further its purposes under the Act and these rules;"], [2, "(g)", "delegate to one or more of the trustees, to a member, agent or an employee such of their powers and duties as they deem fit, and at any time to revoke such delegation; provided that when they delegate any power or duty they must specify in writing —"], [3, "(i)", "the power or duty concerned;"], [3, "(ii)", "a maximum amount of the body corporate’s funds that may be spent for a particular purpose; and"], [3, "(iii)", "any conditions that may be applicable; and"], [2, "(h)", "approach the Community Scheme Ombud Service for relief."], [1, "(4)", "The body corporate must ensure that all money received by the body corporate is deposited to the credit of an interest-bearing bank account —"], [2, "(a)", "in the name of the body corporate; or"], [2, "(b)", "in a trust account opened in terms of either the Estate Agency Affairs Act, 1976 (Act No. 112 of 1976), or the Attorneys Act, 1979 (Act No. 53 of 1979)."]]}, {"n": 24, "title": "Maintenance, repair and replacement plan", "part": "Financial Management", "partNo": 5, "paras": [[1, "(1)", "A body corporate or trustees must prepare a written maintenance, repair and replacement plan for the common property, setting out —"], [2, "(a)", "the major capital items expected to require maintenance, repair and replacement within the next 10 years;"], [2, "(b)", "the present condition or state of repair of those items;"], [2, "(c)", "the time when those items or components of those items will need to be maintained, repaired or replaced;"], [2, "(d)", "the estimated cost of the maintenance, repair and replacement of those items or components;"], [2, "(e)", "the expected life of those items or components once maintained, repaired or replaced; and"], [2, "(f)", "any other information the body corporate considers relevant."], [1, "(2)", "The annual contribution to the reserve fund for the maintenance, repair or replacement of each of the major capital items must be determined according to the following formula: [(estimated cost minus past contribution) divided by expected life]."], [1, "(3)", "A maintenance, repair and replacement plan takes effect on its approval by the members in general meeting; provided that on approval of such a plan, members may lay down conditions for the payment of money from the reserve fund."], [1, "(4)", "The trustees must report the extent to which the approved maintenance, repair and replacement plan has been implemented to each annual general meeting."]]}, {"n": 25, "title": "Insurance", "part": "Financial Management", "partNo": 5, "paras": [[1, "(1)", "The insurance policies of the body corporate in terms of sections 3(1)(h) and (i) of the Act —"], [2, "(a)", "must provide cover against —"], [3, "(i)", "risks referred to in regulation 3 of the Regulations;"], [3, "(ii)", "risks that members resolve must be covered by insurance; and"], [3, "(iii)", "risks that holders of registered first mortgage bonds over not less than 25 per cent in number of the primary sections by written notice to the body corporate may require to be covered by insurance;"], [2, "(b)", "must specify a replacement value for each unit and exclusive use area, excluding the member’s interest in the land included in the scheme; provided that any member may at any time by written notice to the body corporate require that the replacement value specified for that member’s unit or exclusive use area be increased;"], [2, "(c)", "must restrict the application of any “average” clause to individual units and exclusive use areas, so that no such clause applies to the building as a whole;"], [2, "(d)", "must include a clause in terms of which the policy is valid and enforceable by any holder of a registered mortgage bond over a section or exclusive use area against the insurer notwithstanding any circumstances whatsoever which would otherwise entitle the insurer to refuse to make payment of the amount insured, unless and until the insurer terminates the insurance on at least 30 days’ notice to the bondholder; and"], [2, "(e)", "may include provision for “excess” amounts."], [1, "(2)", "A member is responsible —"], [2, "(a)", "for payment of any additional premium payable on account of an increase in the replacement value referred to in sub-rule (1)(b);"], [2, "(b)", "for any excess amount that relates to damage to any part of the building that that member is obliged to repair and maintain in terms of the Act or these rules, and must furnish the body corporate with written proof from the insurer of payment of that amount within seven days of written request."], [1, "(3)", "The body corporate must obtain a replacement valuation of the building and improvements that it must insure at least every three years and present such replacement valuation to the annual general meeting."], [1, "(4)", "The body corporate must prepare for each annual general meeting schedules showing estimates of —"], [2, "(a)", "the replacement value of the building and all improvements to the common property; and"], [2, "(b)", "the replacement value of each unit, excluding the member’s interest in the land included in the scheme, the total of such values of all units being equal to the value referred to in sub-rule 4(a)."], [1, "(5)", "On written request by any registered bondholder and the furnishing of satisfactory proof, the body corporate must record the cession to that bondholder of that member’s interest in any of the proceeds of the insurance policies of the body corporate."], [1, "(6)", "The body corporate must take out public liability insurance to cover the risk of any liability it may incur to pay compensation in respect of —"], [2, "(a)", "any bodily injury to or death or illness of a person on or in connection with the common property; and"], [2, "(b)", "any damage to or loss of property that is sustained as a result of an occurrence or happening in connection with the common property, for an amount determined by members in a general meeting, but not less than 10 million rand or any such higher amount as may be prescribed by the Minister in any one claim and in total for any one period of insurance."], [1, "(7)", "The body corporate must take out insurance for an amount determined by members in general meeting to cover the risk of loss of funds belonging to the body corporate or for which it is responsible, sustained as a result of any act of fraud or dishonesty committed by a trustee, managing agent, employee or other agent of the body corporate."], [1, "(8)", "The body corporate, authorised by a special resolution of members, may insure any additional insurable interest the body corporate has —"], [2, "(a)", "in the land and building included in the scheme; and"], [2, "(b)", "relating to the performance of its functions, for an amount determined in that resolution."]]}, {"n": 26, "title": "Administrative and reserve funds", "part": "Financial Management", "partNo": 5, "paras": [[1, "(1)", "The administrative fund referred to in section 3(1)(a) of the Act must be used to fund the operating expenses of the body corporate for a particular financial year."], [1, "(2)", "The reserve fund maintained in terms of section 3(1)(b) of the Act must be used for the implementation of the maintenance, repair and replacement plan of the body corporate referred to in rule 24."], [1, "(3)", "The following amounts must be paid into the reserve fund —"], [2, "(a)", "any part of the annual levies designated as being for the purpose of reserves or the maintenance, repair and replacement plan;"], [2, "(b)", "any amounts received under an insurance policy in respect of damage or destruction of property for which the body corporate is responsible;"], [2, "(c)", "any interest earned on the investment of the money in the reserve fund;"], [2, "(d)", "any other amounts determined by the body corporate, and all other body corporate income must be paid into the administrative fund."], [1, "(4)", "Money may be paid out of the administrative fund in accordance with trustee resolutions and the approved budget for the administrative fund."], [1, "(5)", "Money may be paid out of the reserve fund —"], [2, "(a)", "at any time in accordance with trustee resolutions and the approved maintenance, repair and replacement plan; or"], [2, "(b)", "if the trustees resolve that such a payment is necessary for the purpose of an urgent maintenance, repair or replacement expense, which purpose includes, without limitation —"], [3, "(i)", "to comply with an order of a court or an adjudicator;"], [3, "(ii)", "to repair, maintain or replace any property for which the body corporate is responsible where there are reasonable grounds to believe that an immediate expenditure is necessary to ensure safety or prevent significant loss or damage to persons or property;"], [3, "(iii)", "to repair any property for which the body corporate is responsible where the need for the repairs could not have been reasonably foreseen in preparing the maintenance, repair and replacement plan; or"], [3, "(iv)", "to enable the body corporate to obtain adequate insurance for property that the body corporate is required to insure; provided that the trustees must report to the members on any such expenditure as soon as possible after it is made."], [1, "(6)", "Expenditure under sub-rule (5)(b) —"], [2, "(a)", "must not exceed —"], [3, "(i)", "the amount necessary for the purpose for which it is expended; or"], [3, "(ii)", "any limitation imposed by the body corporate on expenditure; and"], [2, "(b)", "must comply with any restrictions imposed or directions given by members."]]}, {"n": 27, "title": "Contributions and charges", "part": "Financial Management", "partNo": 5, "paras": [[1, "(1)", "The body corporate must, as soon as possible but not later than 14 days after the approval of the budgets referred to in rule 19(6)(i)(iv) by a general meeting, give each member written notice of the contributions and charges due and payable by that member to the body corporate, which notice must —"], [2, "(a)", "state that the member has an obligation to pay the specified contributions and charges; and"], [2, "(b)", "specify the due date for each payment; and"], [2, "(c)", "if applicable, state that interest at a rate specified in the notice will be payable on any overdue contributions and charges; and"], [2, "(d)", "include details of the dispute resolution process that applies in respect of disputed contributions and charges."], [1, "(2)", "The participation quotas for the purpose of calculating each owners’ levy contribution is —"], [2, "(a)", "7.8688% for the commercial section; and"], [2, "(b)", "0.5484% for each residential section."], [1, "(3)", "If money owing is not paid on the dates specified in the notice referred to in sub-rule (1), the body corporate must send a final notice to the member, which notice must state —"], [2, "(a)", "that the member has an obligation to pay the overdue contributions and charges and any applicable interest immediately; and"], [2, "(b)", "if applicable —"], [3, "(i)", "the interest that is payable in respect of the overdue contributions and charges at the date of the final notice; and"], [3, "(ii)", "the amount of interest that will accrue daily until the payment of the overdue contributions and charges; and"], [2, "(c)", "that the body corporate intends to take action to recover the amount due if the overdue contributions and charges and interest owing are not paid within 14 days after the date the final notice is given."], [1, "(4)", "Subject to rules 23(3) (a) and (b), after the expiry of the financial year and until they become liable for contributions in respect of the next financial year, members are liable for contributions in the same amounts and payable in the same instalments as were due and payable by them during the past financial year."], [1, "(5)", "A member is liable for and must pay to the body corporate all reasonable legal costs and disbursements, as taxed or agreed by the member, incurred by the body corporate in the collection of arrear contributions or any other arrear amounts due and owing by such member to the body corporate, or in enforcing compliance with these rules, the conduct rules or the Act."], [1, "(6)", "The body corporate must not debit a member’s account with any amount that is not a contribution or a charge levied in terms of the Act or these rules without the member’s consent or the authority of a judgment or order by a judge, adjudicator or arbitrator."], [1, "(7)", "The body corporate must in its annual financial statements account for all contributions and any other charges debited to members’ accounts."], [1, "(8)", "On request in writing by a member the body corporate must make available a full and detailed account of all amounts debited and credited to the member’s account with the body corporate."]]}, {"n": 28, "title": "Financial records, budgets, reports and audit", "part": "Financial Management", "partNo": 5, "paras": [[1, "(1)", "The body corporate must —"], [2, "(a)", "keep proper books of accounts that —"], [3, "(i)", "record all its income, expenditure, assets and liabilities;"], [3, "(ii)", "disclose all amounts recovered from members by the body corporate or any managing agent or other service provider acting on its behalf;"], [3, "(iii)", "include individual accounts for each member; and"], [3, "(iv)", "contain all other information necessary to allow members to assess the body corporate’s financial situation and their financial situation in regard to the body corporate."], [2, "(b)", "keep separate books of account and bank accounts for its administrative and reserve funds referred to in sections 3(1)(a) and (b) of the Act;"], [2, "(c)", "prepare annual financial statements for presentation at the annual general meeting, which statements must include analyses of the —"], [3, "(i)", "amounts due to the body corporate in respect of contributions, special contributions and other charges, classified by member and the periods for which such amounts were owed;"], [3, "(ii)", "amounts due by the body corporate to its creditors generally and prominently disclosing amounts due to any public authority, local municipality or other entity for services including, without limitation, water, electricity, gas, sewerage and refuse removal, classified by creditor and the periods for which such amounts were owed;"], [3, "(iii)", "amounts advanced to the body corporate by way of levy finance, a loan, in terms of a guarantee insurance policy or otherwise, setting out the actual or contingent liability of the body corporate and the amounts paid by the body corporate and by any member in terms of such arrangement;"], [3, "(iv)", "amounts in the reserve fund showing the amount available for maintenance, repair and replacement of each major capital item as a percentage of the accrued estimated cost and the rand value of any shortfall;"], [3, "(v)", "premiums and other amounts paid and payments received by the body corporate and any member in terms of the insurance policies of the body corporate and the expiry date of each policy; and"], [3, "(vi)", "amounts due and payable to the Community Schemes Ombud Service."], [2, "(d)", "prepare a maintenance, repair and replacement plan in accordance with rule 24 for presentation at the annual general meeting;"], [2, "(e)", "prepare budgets for the administrative and reserve funds comprising itemised estimates of the anticipated income and expenses during the next financial year for presentation at the annual general meeting; provided that such budgets may include discounts not exceeding 10 per cent of a members’ annual contributions applicable if all those contributions are paid on or before the due dates;"], [2, "(f)", "prepare a report adopted by the trustees reviewing the affairs of the body corporate during the financial year for presentation at the annual general meeting."], [1, "(2)", "On the application of any member, registered bondholder or of the managing agent, the body corporate must make all or any of the books of account and records available for inspection and copying."], [1, "(3)", "The body corporate must ensure that all the body corporate’s books of account and financial records are retained for a period of six years after completion of the transactions, acts or operations to which they relate."], [1, "(4)", "Unless all the sections in the scheme are registered in the name of one person, the body corporate must present audited financial statements to a general meeting for consideration within four months after the end of the financial year."], [1, "(5)", "The audit of a body corporate’s annual financial statements —"], [2, "(a)", "must be carried out by an independent auditor who has not participated in the preparation of the annual financial statements or advised on any aspect of the accounts of the body corporate during the period being reported on;"], [2, "(b)", "need not be carried out in accordance with any recognized financial reporting framework of guidelines for financial accounting;"], [2, "(c)", "must include opinions as to whether or not —"], [3, "(i)", "the annual financial statements accurately reflect the financial position of the body corporate for the financial year under review, with such qualifications and reservations as the auditor considers necessary;"], [3, "(ii)", "the body corporate has complied with the accounting requirements set out in rules 23, 26 and this rule 28, with a specific description of any failure to comply with such requirements;"], [3, "(iii)", "the books of account of the body corporate have been kept and its funds have been managed so as to provide a reasonable level of protection against theft or fraud; and"], [3, "(iv)", "the financial affairs of the body corporate appear to be effectively managed."], [2, "(d)", "must be completed within four months of the end of the body corporate’s financial year."]]}, {"n": 29, "title": "Governance documents and records", "part": "Administrative Management", "partNo": 6, "paras": [[1, "(1)", "The body corporate must —"], [2, "(a)", "lodge a notification of an amendment to the scheme’s rules referred to in section 10(5) of the Act as soon as reasonably possible, but not later than 10 days after the date of the relevant resolution of the body corporate; and"], [2, "(b)", "compile and keep a complete set of all management and conduct rules including —"], [3, "(i)", "an index; and"], [3, "(ii)", "a prominent reference to any rules that confer exclusive use rights, vary the effects of the participation quotas in regard to the value of votes or the liability for contributions, or impose either a financial or a maintenance obligation on members;"], [2, "(c)", "prepare a consolidated set of rules whenever they are amended."], [1, "(2)", "The body corporate must prepare and update the following records —"], [2, "(a)", "minutes of general and trustee meetings, including the following information —"], [3, "(i)", "the date, time and place of the meeting;"], [3, "(ii)", "the names and role of the persons present, including details of the authorisation of proxies or other representatives;"], [3, "(iii)", "the text of all resolutions; and"], [3, "(iv)", "the results of the voting on all motions;"], [2, "(b)", "lists of trustees, members and tenants with their —"], [3, "(i)", "full names;"], [3, "(ii)", "identity numbers or, in the case of non- South African citizens, their passport numbers; and"], [3, "(iii)", "section addresses and mailing addresses, if different;"], [3, "(iv)", "telephone numbers; and"], [3, "(v)", "email or other electronic addresses, if any;"], [2, "(c)", "lists of —"], [3, "(i)", "sections shown on the sectional plan, indicating in each case whether it is a primary or a utility section, its participation quota and the name of the member in whose name it is registered;"], [3, "(ii)", "exclusive use areas with descriptions of purposes and numbers, if any, indicating whether the rights to each area are conferred in terms of section 27 of the Sectional Titles Act or in terms of a rule, and a reference to the relevant rule where applicable; and"], [3, "(iii)", "registered bondholders with their names and addresses;"], [2, "(d)", "details of all future development rights including —"], [3, "(i)", "names and addresses of all registered holders of such rights; and"], [3, "(ii)", "copies of all documentation prepared in terms of section 25(2) of the Sectional Titles Act for any such right; and"], [2, "(e)", "any other records required by the regulations."], [1, "(3)", "The body corporate must obtain and keep copies of all of the following:"], [2, "(a)", "The registered sectional plan and any registered amending sectional plan;"], [2, "(b)", "the Act and the regulations;"], [2, "(c)", "resolutions that deal with changes to the common property, including the conferring of exclusive use rights on members;"], [2, "(d)", "consents and approvals given by the body corporate to members;"], [2, "(e)", "waivers and consents given by members;"], [2, "(f)", "written contracts to which the body corporate is a party;"], [2, "(g)", "any decision of an adjudicator, arbitrator, magistrate or judge in a proceeding in which the body corporate is a party, and any legal opinions obtained by the body corporate;"], [2, "(h)", "the budget and financial statement for the current year and previous years;"], [2, "(i)", "income tax returns;"], [2, "(j)", "insurance policies, endorsement and claim forms;"], [2, "(k)", "correspondence sent or received by the body corporate and trustees; and"], [2, "(l)", "any other records required by the regulations."], [1, "(4)", "On receiving a written request, the body corporate must make the records and documents referred to in this rule available for inspection by, and provide copies of them to —"], [2, "(a)", "a member;"], [2, "(b)", "a registered bondholder; or"], [2, "(c)", "a person authorised in writing by a member or registered bondholder."], [1, "(5)", "The body corporate must comply with a request for inspection or copying under this rule within 10 days unless the request is in respect of the rules, in which case the body corporate must comply with the request within five days."], [1, "(6)", "The body corporate may charge a fee for a copy of a record or document other than the rules, provided that the fee is not more than the reasonable cost associated with the process of making the copy, and the body corporate may refuse to supply the copy until the fee is paid."], [1, "(7)", "If the body corporate terminates its contract with an employee or a managing agent, that person must within 10 days deliver to the body corporate all records referred to in this rule that are in the person’s possession or under the person’s control."], [1, "(8)", "The records referred to in this rule must be in writing or in a form that can be easily converted to writing."]]}, {"n": 30, "title": "Managing Agents", "part": "Administrative Management", "partNo": 6, "paras": [[1, "(1)", "The body corporate may, if trustees so resolve, and must if required by —"], [2, "(a)", "a registered mortgagee of 25 per cent in number of the primary sections; or"], [2, "(b)", "a resolution of members, appoint a managing agent to perform specified financial, secretarial, administrative or other management services under the supervision of the trustees."], [1, "(2)", "A management agreement for any managing agent must comply with the requirements as may be set out in the Regulations."], [1, "(3)", "A management agreement may not endure for a period longer than three years and may be cancelled, without liability or penalty, despite any provision of the management agreement or other agreement to the contrary —"], [2, "(a)", "by the body corporate on two months notice, if the cancellation is first approved by a special resolution passed at a general meeting, or"], [2, "(b)", "by the managing agent on two months notice."], [1, "(4)", "The body corporate or trustees may by ordinary resolution cancel the management agreement in accordance with its terms or refuse to renew the management agreement when it expires."], [1, "(5)", "The trustees shall ensure that there is included in the contract of appointment of all managing agents a provision to the effect that if the managing agent is in breach of any of the provisions of the contract, or if they are guilty of conduct which at common law would justify the termination of a contract between master and servant, the trustees may, without notice, cancel such contract of appointment, and that the managing agent shall have no claim whatsoever against the body corporate or any of the owners as a result of such cancellation."]]}, {"n": 31, "title": "Improvements to common property", "part": "Physical Management", "partNo": 7, "paras": [[1, "(1)", "The body corporate may on the authority of a unanimous resolution make alterations or improvements to the common property that is not reasonably necessary."], [1, "(2)", "The body corporate may propose to make alterations or improvements to the common property that are reasonably necessary; provided that no such proposal may be implemented until all members are given at least 30 days written notice with details of —"], [2, "(a)", "the estimated costs associated with the proposed alterations or improvements;"], [2, "(b)", "details of how the body corporate intends to meet the costs, including details of any special contributions or loans by the body corporate that will be required for this purpose; and"], [2, "(c)", "a motivation for the proposal including drawings of the proposed alterations or improvements showing their effect and a motivation of the need for them; and if during this notice period any member in writing to the body corporate requests a general meeting to discuss the proposal, the proposal must not be implemented unless it is approved, with or without amendment, by a special resolution adopted at a general meeting."], [1, "(3)", "A body corporate must, if so directed by a resolution of members —"], [2, "(a)", "install and maintain separate meters to measure the supply of electricity, water, gas or the supply of any other service to each member’s sections and exclusive use areas and to the common property; and"], [2, "(b)", "recover from members the cost of such supplies to sections and exclusive use areas based on the metered supply."], [1, "(4)", "A body corporate may on the authority of a special resolution install separate pre-payment meters on the common property to control the supply of water or electricity to a section or exclusive use area; provided that all members and occupiers of sections must be given at least 60 days’ notice of the proposed resolution with details of all costs associated with the installation of the pre-payment system and its estimated effect on the cost of the services over the next three years."], [1, "(5)", "If a pre-payment system referred to in sub-rule (4) is installed —"], [2, "(a)", "the body corporate is responsible to ensure that the system does not infringe on the constitutional rights of section occupiers to access basic services; and"], [2, "(b)", "any member who leases a unit to a tenant is responsible to ensure that the system does not infringe the rights of the tenant in terms of the Rental Housing Act, 1999 (Act No. 50 of 1999), or any other law."]]}, {"n": 32, "title": "Use of sections and common property", "part": "Physical Management", "partNo": 7, "paras": [[1, "", "The body corporate must take all reasonable steps to ensure that a member or any other occupier of a section or exclusive use area does not —"], [2, "(a)", "use the common property so as to unreasonably interfere with other persons lawfully on the premises, in breach of section 13(1)(d) of the Act;"], [2, "(b)", "use a section or exclusive use area so as to cause a nuisance, in breach of section 13(1) (e) of the Act;"], [2, "(c)", "contravene the provisions of any —"], [3, "(i)", "law or by-law relating to the use of a section or an exclusive use area; or"], [3, "(ii)", "conditions of a license relating to use of the building or the common property, or the carrying on of a business in the building; or"], [3, "(iii)", "conditions of title applicable to sections or exclusive use areas;"], [2, "(d)", "make alterations to a section or an exclusive use area that are likely to impair the stability of the building or interfere with the use and enjoyment of other sections, the common property or any exclusive use area;"], [2, "(e)", "do anything to a section or exclusive use area that has a material negative affect on the value or utility of any other section or exclusive use area;"], [2, "(f)", "subject to the provisions of section 13(1)(g) of the Act, use a section or exclusive use area for a purpose other than for its intended use as —"], [3, "(i)", "shown expressly or by implication on a registered sectional plan or an approved building plan;"], [3, "(ii)", "can reasonably be inferred from the provisions of the applicable town planning by-laws or the rules of the body corporate; or"], [3, "(iii)", "is obvious from its construction, layout and available amenities;"], [2, "(g)", "construct or place any structure or building improvement on an exclusive use area which in practice constitutes a section or an extension of the boundaries or floor area of a section without complying with the requirements of the Act and the Sectional Titles Act; provided that the body corporate may by ordinary resolution —"], [3, "(i)", "give consent for such a structure or building improvement, if they are satisfied that it does not require compliance with such requirements;"], [3, "(ii)", "prescribe any reasonable condition in regard to the use or appearance of the structure or building improvement; and"], [3, "(iii)", "withdraw any consent if the member or other occupier of a section breaches any such condition;"], [2, "(h)", "let or sub-let the exclusive use area linked to the section that they own or occupy, unless the exclusive use area has been transferred from the body corporate to the owner by the registration of a notarial deed of cession;"], [2, "(i)", "allow the use of their exclusive use parking bay to any person who is not an owner or occupant of Senator Park, or an owner or occupant’s visitor, contractor or employee who requires parking in order to visit or work in the building;"], [2, "(j)", "let their section for only 1 night;"], [2, "(k)", "allow their residential section to be occupied by more than 2 adults."]]}, {"n": 33, "title": "Obligation to maintain", "part": "Physical Management", "partNo": 7, "paras": [[1, "(1)", "Notwithstanding that a water-heating installation forms part of the common property and is insured by the body corporate, a member must maintain, repair and, when necessary, replace such an installation which serves that member’s section or exclusive use area; provided that where such an installation serves sections owned or exclusive use areas held by more than one member, the members concerned must share the maintenance, repair and replacement costs on a pro-rata basis."], [1, "(2)", "All maintenance, repairs and replacements of water-heating installations must comply with the relevant laws and regulations, and members must provide copies of the necessary certifications to the trustees in order to prove compliance."], [1, "(3)", "If despite written demand by the body corporate, a member refuses or fails to —"], [2, "(a)", "carry out work in respect of that member’s section ordered by a competent authority as required by section 13(1)(b) of the Act; or"], [2, "(b)", "repair or maintain a section owned by that member in a state of good repair as required by section 13(1)(c) of the Act; and that failure threatens the stability of the common property, the safety of the building or otherwise materially prejudices the interests of the body corporate, its members or the occupiers of sections generally, the body corporate must remedy the member’s failure and recover the reasonable cost of doing so from that member; provided that in the case of an emergency, no demand or notice need be given to the member concerned."]]}]};

const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---------- cross-references ---------- */
function subId(set, n, sub){ return set+"-"+n+(sub?"-"+sub:""); }
function exists(set, n){ return DATA[set].some(r=>r.n===n); }
function refLink(text, set, n, subs){
  if(!exists(set,n)) return text;
  const m = subs && subs.match(/^\((\d+)\)/);
  const r = DATA[set].find(x=>x.n===n);
  const ok = m && r.paras.some(p=>p[0]===1 && p[1]==="("+m[1]+")");
  const id = subId(set, n, ok ? m[1] : null);
  return `<a class="ref" href="#${id}" data-ref="${id}">${text}</a>`;
}
function linkify(html, set, ruleN){
  const other = set==="conduct" ? "management" : "conduct";
  // 1. "conduct rule 15" / "management rule 26(2)" / "rule 22(4)" / "rules 26(5) and 26(6)" / "rules 23, 26 and this rule 28"
  html = html.replace(/\b(?:(conduct|management)\s+)?(rules?)\s+(\d+)((?:\s?\([0-9a-z]{1,4}\))*)((?:(?:,\s*|\s+and\s+|\s+or\s+)(?:this rule\s+)?\d+(?:\s?\([0-9a-z]{1,4}\))*)*)/gi,
    (all, which, word, num, subs, tail) => {
      if(/^rules?$/i.test(word) && /section\s*$/i.test("")) return all;
      const tset = which ? which.toLowerCase() : set;
      let out = refLink((which? which+" " : "")+word+" "+num+subs, tset, +num, subs.replace(/\s/g,""));
      if(tail){
        out += tail.replace(/(\d+)((?:\s?\([0-9a-z]{1,4}\))*)/g, (t, n2, s2) => refLink(t, tset, +n2, s2.replace(/\s/g,"")));
      }
      return out;
    });
  // 2. "sub-rule (2)" / "sub-rules (5) and (6)" / "sub-rule (7)(d)" -> same rule
  html = html.replace(/\b(sub-rules?)\s+(\(\d+\)(?:\([a-z]{1,4}\))*)((?:(?:,\s*|\s+and\s+|\s+or\s+)\(\d+\)(?:\([a-z]{1,4}\))*)*)/gi,
    (all, word, first, tail) => {
      const mk = (t, s) => { const k=s.match(/\((\d+)\)/)[1]; return `<a class="ref" href="#${subId(set,ruleN,k)}" data-ref="${subId(set,ruleN,k)}">${t}</a>`; };
      let out = mk(word+" "+first, first);
      if(tail) out += tail.replace(/\(\d+\)(?:\([a-z]{1,4}\))*/g, t => mk(t,t));
      return out;
    });
  return html;
}

/* ---------- render ---------- */
function renderDoc(set){
  const d = DATA[set], S = SETS[set];
  let h = `<header class="cover"><p class="kicker">Senator Park Body Corporate</p><h1>${S.name}</h1>
    <p class="draft"><b>Proposed rules</b> · ${S.date}</p></header>`;
  let part = 0;
  for(const r of d){
    if(r.partNo !== part){ part = r.partNo; h += `<div class="part" id="${set}-part${part}">Part ${part} · ${esc(r.part)}</div>`; }
    h += `<section class="rule" id="${subId(set,r.n)}" data-n="${r.n}"><h2><span class="no">${r.n}</span><span>${esc(r.title)}</span></h2>`;
    for(const [lvl,lab,txt] of r.paras){
      const num = lvl===1 && lab ? lab.slice(1,-1) : null;
      const id = num ? ` id="${subId(set,r.n,num)}"` : "";
      h += `<p class="p l${lvl}${lab?"":" nolabel"}"${id}>${lab?`<span class="lb">${lab}</span>`:""}${linkify(esc(txt), set, r.n)}</p>`;
    }
    h += `</section>`;
  }
  if(set==="conduct"){
    h += `<div class="part" id="conduct-annex">Annexures</div>
    <section class="rule annex" id="conduct-annexA"><h2><span class="no">A</span><span>Layout of exclusive use areas (parking bays)</span></h2>
      <figure><a href="${ANNEX_A}" target="_blank" rel="noopener"><img src="${ANNEX_A}" alt="Annexure A: layout plan of parking bays P1 to P27 on the ground floor, between Bloem Street and Keerom Street"></a>
      <figcaption>Tap the plan to open it full size. Referred to in rule 21(2).</figcaption></figure></section>
    <section class="rule annex" id="conduct-annexB"><h2><span class="no">B</span><span>Exclusive use area schedule</span></h2>
      <p class="note">Parking bays linked to sections, referred to in rule 21(4). BC = body corporate.</p>
      <table><thead><tr><th>Bay</th><th>m²</th><th>Section</th><th>Unit</th></tr></thead><tbody>
      ${ANNEX_B.map(b=>`<tr id="bay-${b[0]}"><td><b>${b[0]}</b></td><td>${b[1]}</td><td>${b[2]}</td><td>${b[3]}</td></tr>`).join("")}
      </tbody></table><p class="note">Note on the plan: P8 transferred from Section 95 to Section 157.</p></section>`;
  }
  h += `<div class="end">◆ ◆ ◆</div>`;
  $("#doc-"+set).innerHTML = h;
}

function renderDrawer(){
  let h = "";
  for(const set of [current, current==="conduct"?"management":"conduct"]){
    const d = DATA[set];
    h += `<details class="dset" ${set===current?"open":""}><summary>${SETS[set].name}</summary>`;
    let part = 0;
    for(const r of d){
      if(r.partNo!==part){ part=r.partNo; h += `<div class="dpart">Part ${part} · ${esc(r.part)}</div>`; }
      h += `<button class="ditem" data-go="${subId(set,r.n)}"><span class="n">${r.n}</span><span>${esc(r.title)}</span></button>`;
    }
    if(set==="conduct"){
      h += `<div class="dpart">Annexures</div>
        <button class="ditem" data-go="conduct-annexA"><span class="n">A</span><span>Parking bay layout plan</span></button>
        <button class="ditem" data-go="conduct-annexB"><span class="n">B</span><span>Parking bay schedule</span></button>`;
    }
    h += `</details>`;
  }
  $("#dscroll").innerHTML = h;
}

/* ---------- set switching & navigation ---------- */
function setOf(id){ return id.startsWith("management") ? "management" : "conduct"; }
function showSet(set, keepScroll){
  if(set===current && keepScroll) return;
  current = set;
  for(const s in SETS){ $("#doc-"+s).hidden = s!==set; }
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.set===set));
  renderDrawer();
  if(!keepScroll) window.scrollTo(0,0);
}
function clearMarks(){
  document.querySelectorAll("mark[data-hl]").forEach(m=>{ const t=document.createTextNode(m.textContent); m.replaceWith(t); t.parentNode.normalize(); });
}
function highlightIn(el, words){
  if(!el || !words.length) return;
  const re = new RegExp("("+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");
  const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const nodes=[]; while(walk.nextNode()) nodes.push(walk.currentNode);
  for(const n of nodes){
    if(!re.test(n.nodeValue)){ re.lastIndex=0; continue; } re.lastIndex=0;
    const frag=document.createDocumentFragment(); let last=0;
    n.nodeValue.replace(re,(m,_,i)=>{ frag.append(n.nodeValue.slice(last,i)); const mk=document.createElement("mark"); mk.dataset.hl=1; mk.textContent=m; frag.append(mk); last=i+m.length; });
    frag.append(n.nodeValue.slice(last)); n.replaceWith(frag);
  }
}
function flash(el){ el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
function go(id, opts={}){
  const set = id.startsWith("bay-") ? "conduct" : setOf(id);
  if(set!==current) showSet(set, true);
  const el = document.getElementById(id);
  if(!el) return;
  el.scrollIntoView({block:"start", behavior: opts.smooth===false ? "auto" : "smooth"});
  flash(el.classList.contains("rule") && !opts.words ? el : el);
  try{ history.replaceState(null,"","#"+id); }catch(e){}
  barLock = Date.now() + 1400; bar.classList.remove("hide");
}

/* back stack for reference jumps */
const backStack = [];
function pushBack(){ backStack.push({set:current, y:window.scrollY}); $("#backBtn").classList.remove("off"); }
$("#backBtn").addEventListener("click", ()=>{
  const s = backStack.pop(); if(!s) return;
  if(s.set!==current) showSet(s.set, true);
  window.scrollTo({top:s.y, behavior:"smooth"});
  if(!backStack.length) $("#backBtn").classList.add("off");
});

document.addEventListener("click", e=>{
  const a = e.target.closest("a.ref");
  if(a){ e.preventDefault(); pushBack(); clearMarks(); go(a.dataset.ref); }
});

/* ---------- top bar hide on scroll, top button ---------- */
const bar = $("#bar"); let lastY = 0, upAcc = 0, barLock = 0;
window.addEventListener("scroll", ()=>{
  const y = window.scrollY, dy = y - lastY;
  $("#topBtn").classList.toggle("off", y < 900);
  if(Date.now() < barLock){ lastY = y; return; }
  if(y < 80){ bar.classList.remove("hide"); upAcc=0; }
  else if(dy > 4){ bar.classList.add("hide"); upAcc=0; }
  else if(dy < 0){ upAcc += -dy; if(upAcc > 24) bar.classList.remove("hide"); }
  lastY = y;
  $("#topBtn").classList.toggle("off", y < 900);
}, {passive:true});
$("#topBtn").addEventListener("click", ()=>window.scrollTo({top:0, behavior:"smooth"}));

/* ---------- segmented switch ---------- */
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click", ()=>{
  if(b.dataset.set===current) { window.scrollTo({top:0,behavior:"smooth"}); return; }
  backStack.length=0; $("#backBtn").classList.add("off"); clearMarks(); showSet(b.dataset.set);
  try{ history.replaceState(null,"","#"+b.dataset.set); }catch(e){}
}));

/* ---------- drawer ---------- */
const drawer=$("#drawer"), scrim=$("#scrim");
const wide = () => window.matchMedia("(min-width:1100px)").matches;
function openDrawer(){ drawer.classList.add("on"); scrim.classList.add("on"); }
function closeDrawer(){ drawer.classList.remove("on"); scrim.classList.remove("on"); }
$("#menuBtn").addEventListener("click", openDrawer);
$("#closeDrawer").addEventListener("click", closeDrawer);
scrim.addEventListener("click", closeDrawer);
$("#dscroll").addEventListener("click", e=>{
  const b = e.target.closest("[data-go]"); if(!b) return;
  if(!wide()) closeDrawer();
  clearMarks(); backStack.length=0; $("#backBtn").classList.add("off");
  setTimeout(()=>go(b.dataset.go), wide()?0:220);
});

/* ---------- text size ---------- */
let fs = 19;
try{ fs = +localStorage.getItem("sp-rules-fs") || 19; }catch(e){}
function applyFs(){ document.documentElement.style.setProperty("--fs", fs+"px"); try{ localStorage.setItem("sp-rules-fs", fs); }catch(e){} }
$("#szDown").addEventListener("click", ()=>{ fs=Math.max(15,fs-1); applyFs(); });
$("#szUp").addEventListener("click", ()=>{ fs=Math.min(28,fs+1); applyFs(); });

/* ---------- search ---------- */
const INDEX = [];
for(const set in DATA){
  for(const r of DATA[set]){
    INDEX.push({set, n:r.n, title:r.title, id:subId(set,r.n), paras:r.paras.map(p=>({lab:p[1], lvl:p[0], t:p[2], nt:norm(p[2])})), nTitle:norm(r.title)});
  }
}
INDEX.push({set:"conduct", n:"B", title:"Exclusive use area schedule (parking bays)", id:"conduct-annexB",
  paras:ANNEX_B.map(b=>{ const t=`Bay ${b[0]} · ${b[1]} m² · Section ${b[2]} · Unit ${b[3]}`; return {lab:"", lvl:1, t, nt:norm(t+" parking bay"), bay:b[0]}; }), nTitle:norm("Annexure B exclusive use area schedule parking bays")});

const search=$("#search"), q=$("#q");
function openSearch(){ search.classList.add("on"); document.body.style.overflow="hidden"; renderResults(); setTimeout(()=>q.focus(),30); }
function closeSearch(){ search.classList.remove("on"); document.body.style.overflow=""; q.blur(); }
$("#searchBtn").addEventListener("click", openSearch);
$("#cancel").addEventListener("click", closeSearch);
$("#clr").addEventListener("click", ()=>{ q.value=""; renderResults(); q.focus(); });
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ closeSearch(); closeDrawer(); }
  if((e.key==="/" || (e.key==="k"&&(e.metaKey||e.ctrlKey))) && !search.classList.contains("on") && document.activeElement.tagName!=="INPUT"){ e.preventDefault(); openSearch(); }
});
let tmr; q.addEventListener("input", ()=>{ clearTimeout(tmr); tmr=setTimeout(renderResults, 80); });
q.addEventListener("keydown", e=>{ if(e.key==="Enter"){ const f=$("#sres .res"); if(f) f.click(); } });

function terms(){ return norm(q.value).split(/\s+/).filter(w=>w.length>0); }
function snippet(t, words){
  const nt = norm(t); let i = -1;
  for(const w of words){ const k=nt.indexOf(w); if(k>=0 && (i<0||k<i)) i=k; }
  let s = Math.max(0, i-60), e = Math.min(t.length, (i<0?0:i)+140);
  if(s>0){ const sp=t.indexOf(" ", s); if(sp>0 && sp<i) s=sp+1; }
  let out = (s>0?"…":"") + t.slice(s,e) + (e<t.length?"…":"");
  out = esc(out);
  const re = new RegExp("("+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");
  return out.replace(re,"<mark>$1</mark>");
}
function renderResults(){
  const box=$("#sres"); const words=terms();
  $("#sbox").classList.toggle("has", q.value.length>0);
  if(!words.length){
    box.innerHTML = `<div class="chips-h">Popular topics</div><div class="chips">${TOPICS.map(t=>`<button class="chip" data-q="${t[1]}">${t[0]}</button>`).join("")}</div>
      <div class="chips-h" style="margin-top:22px">Tips</div><p class="empty" style="padding-top:0">Type any word, e.g. <i>gas</i>, <i>lift</i>, <i>tenant</i>, a bay like <i>P8</i>, or a rule number like <i>22</i>. Results come from both rule sets.</p>`;
    return;
  }
  // rule number jump
  const numHits = [];
  if(/^\d{1,2}$/.test(q.value.trim())){
    const n=+q.value.trim();
    for(const set in DATA){ const r=DATA[set].find(x=>x.n===n); if(r) numHits.push({set, r}); }
  }
  const hits = { conduct:[], management:[] };
  for(const r of INDEX){
    const all = r.nTitle + " " + r.paras.map(p=>p.nt).join(" ");
    if(!words.every(w=>all.includes(w))) continue;
    // paragraphs that contain the most words
    let best=null, bestScore=-1, count=0;
    for(const p of r.paras){
      const sc = words.filter(w=>p.nt.includes(w)).length;
      if(sc>0) count++;
      if(sc>bestScore){ best=p; bestScore=sc; }
    }
    const titleHit = words.every(w=>r.nTitle.includes(w));
    hits[r.set].push({r, best, count, score: (titleHit?100:0) + bestScore*10 + count});
  }
  let h = "";
  if(numHits.length){
    h += `<div class="rgroup">Go to rule ${esc(q.value.trim())}</div>`;
    for(const {set,r} of numHits) h += `<button class="res" data-id="${subId(set,r.n)}" data-words=""><div class="t"><span class="n">${r.n}</span>${esc(r.title)}</div><div class="m">${SETS[set].name}</div></button>`;
  }
  const total = hits.conduct.length + hits.management.length;
  if(!total && !numHits.length){ box.innerHTML = `<p class="empty">Nothing found for “${esc(q.value)}”. Try a shorter or different word.</p>`; return; }
  if(total) h += `<p class="scount">${hits.conduct.length} in Conduct Rules · ${hits.management.length} in Management Rules</p>`;
  for(const set of [current, current==="conduct"?"management":"conduct"]){
    const list = hits[set].sort((a,b)=>b.score-a.score);
    if(!list.length) continue;
    h += `<div class="rgroup">${SETS[set].name}</div>`;
    for(const {r,best,count} of list){
      let target = r.id;
      if(best && best.bay) target = "bay-"+best.bay;
      else if(best && best.lvl===1 && /^\(\d+\)$/.test(best.lab)) target = subId(r.set, r.n, best.lab.slice(1,-1));
      const where = best && best.lab ? ` ${best.lab}` : "";
      h += `<button class="res" data-id="${target}" data-rule="${r.id}" data-words="${esc(words.join(" "))}">
        <div class="t"><span class="n">${r.n}</span>${esc(r.title)}</div>
        ${best?`<div class="s">${snippet(best.t, words)}</div>`:""}
        <div class="m">${count>1?count+" matches in this rule":"Rule "+r.n+where}</div></button>`;
    }
  }
  box.innerHTML = h;
}
$("#sres").addEventListener("click", e=>{
  const chip = e.target.closest(".chip");
  if(chip){ q.value = chip.dataset.q; renderResults(); return; }
  const r = e.target.closest(".res"); if(!r) return;
  const words = r.dataset.words ? r.dataset.words.split(" ") : [];
  closeSearch(); clearMarks(); backStack.length=0; $("#backBtn").classList.add("off");
  const set = r.dataset.id.startsWith("bay-") ? "conduct" : setOf(r.dataset.id);
  if(set!==current) showSet(set, true);
  if(words.length) highlightIn(document.getElementById(r.dataset.rule || r.dataset.id), words);
  requestAnimationFrame(()=>go(r.dataset.id));
});

/* ---------- start ---------- */
renderDoc("conduct"); renderDoc("management"); applyFs();
(function(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(h==="management"){ showSet("management"); return; }
  showSet("conduct", false); renderDrawer();
  if(h && document.getElementById(h)) setTimeout(()=>go(h,{smooth:false}), 50);
})();
</script>
</body>
</html>

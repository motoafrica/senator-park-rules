<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
<title>Senator Park Rules</title>
<style>
:root{
  --bg:#f7f4ee; --paper:#fffdf9; --ink:#22211f; --ink2:#5b5850; --ink3:#8a867c;
  --line:#e4dfd4; --accent:#1f5f5b; --accent-soft:#e3efed; --mark:#ffe58a; --mark-ink:#22211f;
  --bar:rgba(247,244,238,.94); --shadow:0 6px 24px rgba(30,25,15,.12);
  --fs:19px; --serif: Charter, "Bitstream Charter", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --barh:56px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16181b; --paper:#1d2024; --ink:#e7e4dd; --ink2:#b3afa5; --ink3:#837f76;
    --line:#2e3238; --accent:#7cc4bc; --accent-soft:#22343a; --mark:#7a6512; --mark-ink:#fff6d6;
    --bar:rgba(22,24,27,.94); --shadow:0 6px 24px rgba(0,0,0,.45); }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:var(--fs);line-height:1.62}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--accent)}

/* ---------- top bar ---------- */
.bar{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(var(--barh) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 6px 0;display:flex;align-items:center;gap:4px;
  background:var(--bar);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);transition:transform .25s ease;font-family:var(--sans)}
.bar.hide{transform:translateY(-110%)}
.icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon:active{background:var(--accent-soft)}
.icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{flex:1;display:flex;justify-content:center}
.seg-in{display:flex;background:var(--line);border-radius:11px;padding:3px;max-width:340px;width:100%}
.seg button{flex:1;padding:7px 6px;border-radius:9px;font-size:15px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ---------- reading column ---------- */
main{padding:calc(var(--barh) + env(safe-area-inset-top) + 18px) 16px 120px;transition:padding .25s}
.doc{max-width:40em;margin:0 auto}
.doc[hidden]{display:none}
.cover{padding:10px 0 6px;border-bottom:1px solid var(--line);margin-bottom:8px}
.cover .kicker{font-family:var(--sans);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0}
.cover h1{font-size:1.65em;line-height:1.2;margin:.2em 0 .25em;font-weight:700;letter-spacing:-.01em}
.draft{font-family:var(--sans);font-size:13.5px;color:var(--ink2);margin:0 0 10px}
.draft b{color:var(--ink);font-weight:600}
.part{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent);margin:2.4em 0 .2em;padding-top:.4em;scroll-margin-top:calc(var(--barh) + 16px)}
.rule{scroll-margin-top:calc(var(--barh) + 12px);padding:.2em 0 .4em}
.rule h2{font-size:1.18em;line-height:1.3;margin:1.3em 0 .45em;display:flex;gap:.55em;align-items:baseline}
.rule h2 .no{font-family:var(--sans);font-size:.78em;font-weight:700;color:var(--accent);min-width:1.6em}
.p{margin:0 0 .55em;position:relative;padding-left:2.3em;scroll-margin-top:calc(var(--barh) + 20px)}
.p .lb{position:absolute;left:0;top:0;font-family:var(--sans);font-size:.8em;line-height:2.02;color:var(--ink3);font-variant-numeric:tabular-nums}
.p.l2{margin-left:1.3em}
.p.l3{margin-left:2.6em}
.p.l1.nolabel{padding-left:0}
.p.flash, .rule.flash>h2{animation:flash 2.2s ease}
@keyframes flash{0%,30%{background:var(--accent-soft);box-shadow:0 0 0 6px var(--accent-soft)}100%{background:transparent;box-shadow:0 0 0 6px transparent}}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}
a.ref{text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent);text-underline-offset:3px;text-decoration-thickness:1.5px}
.end{text-align:center;color:var(--ink3);letter-spacing:.6em;margin:3em 0 1em}

/* annexures */
.annex h2{font-size:1.18em;margin:1.6em 0 .4em}
.annex figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.annex figure img{width:100%;height:auto;display:block}
.annex figcaption{font-family:var(--sans);font-size:13px;color:var(--ink3);margin-top:6px}
table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600}
tr.flash td{animation:flash 2.2s ease}
.note{font-family:var(--sans);font-size:14px;color:var(--ink2)}

/* ---------- floating buttons ---------- */
.fab{position:fixed;z-index:25;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;align-items:flex-end;font-family:var(--sans)}
.pill{display:flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:22px;background:var(--paper);border:1px solid var(--line);
  box-shadow:var(--shadow);font-size:15px;font-weight:600;transition:opacity .2s, transform .2s}
.pill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pill.off{opacity:0;transform:translateY(10px);pointer-events:none}
.pill.back{background:var(--accent);color:var(--paper);border-color:transparent}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:41;top:0;bottom:0;left:0;width:min(86vw,360px);background:var(--paper);
  transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  font-family:var(--sans);border-right:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.drawer.on{transform:none;box-shadow:var(--shadow)}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 6px 18px}
.dhead strong{font-size:17px}
.dscroll{overflow-y:auto;flex:1;padding:0 8px 16px;overscroll-behavior:contain}
.dset{margin:6px 0 10px}
.dset>summary{list-style:none;cursor:pointer;padding:10px 10px;font-weight:700;font-size:15px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.dset>summary::-webkit-details-marker{display:none}
.dset>summary::after{content:"›";font-size:20px;color:var(--ink3);transition:transform .2s}
.dset[open]>summary::after{transform:rotate(90deg)}
.dpart{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:12px 10px 4px}
.ditem{display:flex;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:9px;font-size:15px;line-height:1.3;color:var(--ink)}
.ditem:active,.ditem:hover{background:var(--accent-soft)}
.ditem .n{color:var(--ink3);min-width:1.7em;font-variant-numeric:tabular-nums;text-align:right}
.dfoot{border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:10px}
.dfoot span{font-size:14px;color:var(--ink2)}
.sz{display:flex;gap:6px}
.sz button{width:46px;height:40px;border-radius:10px;border:1px solid var(--line);font-weight:700}
.sz button:first-child{font-size:14px}.sz button:last-child{font-size:19px}

/* wide screens: drawer stays open */
@media (min-width:1100px){
  .drawer{transform:none;top:calc(var(--barh) + env(safe-area-inset-top));box-shadow:none}
  .drawer .dhead{display:none}
  .scrim{display:none}
  main{padding-left:calc(360px + 32px)}
  #menuBtn{visibility:hidden}
}

/* ---------- search ---------- */
.search{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;font-family:var(--sans)}
.search.on{display:flex}
.shead{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px 12px;border-bottom:1px solid var(--line)}
.sbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0 10px;height:46px}
.sbox svg{width:20px;height:20px;stroke:var(--ink3);fill:none;stroke-width:2;flex:none}
.sbox input{flex:1;border:0;outline:0;background:transparent;font-size:17px;color:var(--ink);min-width:0}
.sbox .clr{width:30px;height:30px;border-radius:15px;display:none;place-items:center;color:var(--ink3);font-size:18px}
.sbox.has .clr{display:grid}
.cancel{padding:0 4px 0 6px;height:44px;font-size:16px;color:var(--accent);font-weight:600}
.sbody{overflow-y:auto;flex:1;padding:8px 12px 40px;overscroll-behavior:contain}
.sbody .inner{max-width:44em;margin:0 auto}
.chips-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin:14px 4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:20px;background:var(--paper);border:1px solid var(--line);font-size:15px;font-weight:600}
.chip:active{background:var(--accent-soft)}
.scount{font-size:13.5px;color:var(--ink2);margin:6px 4px 10px}
.rgroup{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:16px 4px 6px}
.res{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.res:active{background:var(--accent-soft)}
.res .t{font-weight:700;font-size:15.5px;line-height:1.3}
.res .t .n{color:var(--accent);margin-right:6px}
.res .s{font-family:var(--serif);font-size:15px;color:var(--ink2);margin-top:4px;line-height:1.45}
.res .m{font-size:12.5px;color:var(--ink3);margin-top:4px}
.empty{color:var(--ink2);padding:24px 4px;font-size:15px}

@media print{
  .bar,.fab,.drawer,.scrim,.search{display:none!important}
  main{padding:0!important}
  body{background:#fff;color:#000;font-size:11pt}
  .doc[hidden]{display:none}
  a.ref{color:inherit;text-decoration:none}
}
</style>
</head>
<body>

<header class="bar" id="bar">
  <button class="icon" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="seg"><div class="seg-in" role="group" aria-label="Rule set">
    <button data-set="conduct" aria-pressed="true">Conduct</button>
    <button data-set="management" aria-pressed="false">Management</button>
  </div></div>
  <button class="icon" id="searchBtn" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
</header>

<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer" aria-label="Contents">
  <div class="dhead"><strong>Contents</strong>
    <button class="icon" id="closeDrawer" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="dscroll" id="dscroll"></div>
  <div class="dfoot"><span>Text size</span><div class="sz"><button id="szDown" aria-label="Smaller text">A−</button><button id="szUp" aria-label="Larger text">A+</button></div></div>
</nav>

<main id="main">
  <article class="doc" id="doc-conduct"></article>
  <article class="doc" id="doc-management" hidden></article>
</main>

<div class="fab">
  <button class="pill back off" id="backBtn"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Back</button>
  <button class="pill off" id="topBtn" aria-label="Back to top"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>Top</button>
</div>

<div class="search" id="search" role="dialog" aria-label="Search">
  <div class="shead">
    <div class="sbox" id="sbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Search both rule sets" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button class="clr" id="clr" aria-label="Clear">×</button></div>
    <button class="cancel" id="cancel">Cancel</button>
  </div>
  <div class="sbody"><div class="inner" id="sres"></div></div>
</div>

ion."], [1, "(3)", "Directives or guidelines issued by the trustees may not be in conflict with any conduct rules, management rules, prescribed rules, regulations or other laws, or be in conflict with directives or restrictions received from owners at a general meeting."], [1, "(4)", "All directives and guidelines issued by the trustees shall be communicated to all owners."]]}, {"n": 5, "title": "Written consent of the trustees", "part": "Introductory", "partNo": 1, "paras": [[1, "(1)", "Whenever the written consent of the trustees is required in terms of these rules, application for such consent must be made in writing and the applicant must furnish the trustees with all the information, details and documentation as reasonably required by them. The written consent of the trustees in terms of these rules or the withdrawal thereof shall be in such format as the trustees shall from time to time determine."], [1, "(2)", "The trustees may attach conditions to their consent in order to ensure compliance with the body and conduct rules or with the relevant legislation. In the event of non-compliance with any of their written conditions, the trustees may summarily withdraw their consent. When withdrawing their consent, the trustees shall notify the owner or occupier in writing and provide him or her with reasons for their withdrawal."], [1, "(3)", "The owner or occupier who requested the trustees’ consent may not proceed with the matter that consent was requested for until they received such consent in writing from the trustees, and may also not continue with the matter if consent was withdrawn in terms of sub-rule (2)."]]}, {"n": 6, "title": "Written notices or requests", "part": "Introductory", "partNo": 1, "paras": [[1, "(1)", "A written notice or request in terms of these rules must be in such format as the trustees may from time to time prescribe."], [1, "(2)", "A written notice from the trustees will be regarded as having been properly delivered if:"], [2, "(a)", "delivered to the owner or occupier by hand, in which event it shall be regarded as having been received on the date of delivery; or"], [2, "(b)", "delivered by registered post to the owner or occupier to the address of the section or to his or her other domicillium citandi et executandi, in which event it shall be regarded as having been received on the 5th day after the date of posting; or"], [2, "(c)", "delivered by email to the owner or occupier, in which event it shall be regarded as having been received on the date of transmittal."], [1, "(3)", "A written notice or request from an owner or occupier to the trustees will be regarded as having been properly delivered if:"], [2, "(a)", "delivered to a serving trustee by hand, in which event it shall be regarded as having been received on the date of delivery; or"], [2, "(b)", "delivered by email to the designated email address of the board of trustees, or to a serving trustee s confirmed personal email address, in which event it shall be regarded as having been received on the date of the transmittal; or"], [2, "(c)", "delivered by any other means that has been clearly indicated to all owners and occupiers by the current board of trustees."]]}, {"n": 7, "title": "Relaxation of these rules", "part": "Introductory", "partNo": 1, "paras": [[1, "", "No indulgence or relaxation in the application of these rules shall constitute a precedent, waiver or consent, or prevent the enforcement of the rules by the trustees."]]}, {"n": 8, "title": "Contravention of these rules", "part": "Introductory", "partNo": 1, "paras": [[1, "", "If an owner or occupier, or the employees, contractors, guests, visitors or family members of the owner or occupier, contravene these rules, then the trustees shall be entitled, without prejudice of the other rights or remedies which the body corporate may have in law or in the rules, to:"], [2, "(a)", "enter the section, exclusive use area or any other part of the common property to take such action as may be reasonably required to remedy the contravention and hold the owner of the section liable for the costs incurred in this regard; and/or"], [2, "(b)", "bring a court application for a suitable order; and/or"], [2, "(c)", "instruct an attorney to take legal steps against the owner or occupier; and/or"], [2, "(d)", "institute arbitration or mediation proceedings; and/or"], [2, "(e)", "apply to the Ombud for a suitable order or intervention."]]}, {"n": 9, "title": "Liability for damage, legal costs and other costs", "part": "Introductory", "partNo": 1, "paras": [[1, "(1)", "If an owner or occupier, or the employees, contractors, guests, visitors or family members of the owner or occupier, cause damage to the common property, the owner of the section shall be liable to the body corporate for the damage caused and for the cost of repairs and any other loss that the body corporate may suffer as a result."], [1, "(2)", "An owner shall be liable for all reasonable legal costs, expenses and charges incurred by the body corporate in obtaining the recovery of costs of repairs, or in enforcing compliance with these rules, or in recovering any amounts due and owing by such owner to the body corporate."]]}, {"n": 10, "title": "Disclaimer", "part": "Introductory", "partNo": 1, "paras": [[1, "(1)", "All persons who use the premises, whether it is use of common property or use of a section, do so entirely at their own risk and shall have no claim against the body corporate of whatsoever nature arising from such use, nor for anything which may befall any person during the course of such use, whether caused by human or animal agency, natural phenomena or otherwise."], [1, "(2)", "The body corporate shall not be liable for any injury, loss or damage of any description that any person may sustain, physically or to his property, directly or indirectly, in or about the common property, its amenities or in the individual sections, nor for any act done or for any neglect on the part of the body corporate or any of the body corporate employees, agents or contractors."]]}, {"n": 11, "title": "Fire safety", "part": "Safety, Security & Access", "partNo": 2, "paras": [[1, "(1)", "No person may tamper with or activate the fire hoses, fire extinguishers or fire alarms, except for the purpose of fighting a fire or raising the alarm in an emergency."], [1, "(2)", "Owners must make their tenants aware of the fire safety information of the building and, in particular, the nearest fire hoses and fire extinguishers and the nearest fire escape."], [1, "(3)", "The owner or tenant of a section must not, without the trustees’ written consent, store a flammable substance in a section or on the common property unless the substance is:"], [2, "(a)", "sold for domestic use in a retail store and stored in its original container and according to the manufacturer’s instructions; or"], [2, "(b)", "in the fuel tank of a vehicle or generator on the common property; or"], [2, "(c)", "in a gas cylinder which was approved by the trustees in terms of sub-rule (4)."], [1, "(4)", "An owner or occupier shall not without the prior written consent of the trustees, which may not unreasonably be withheld or delayed, install any gas bottle or gas heating or cooking system in respect of a section or on the common property. Any such installation must comply with the relevant legislation and the owner or occupier making the request shall obtain the required compliance certificate at his or her own costs, which must be submitted to the trustees."], [1, "(5)", "Owners and occupiers must make every effort to avoid creating a fire hazard in their section or on the common property, and if the trustees or the building manager informs an owner or occupier of a fire hazard created by them, the owner or occupier must take immediate steps to eliminate the hazard."], [1, "(6)", "No smoking or open flame is allowed anywhere on the common property."], [1, "(7)", "Fire escape routes, such as the hallways and stairwells, must be kept clear of objects at all times. No objects may be placed on or protrude into the hallways or stairwells that serve as a fire escape route."]]}, {"n": 12, "title": "Security", "part": "Safety, Security & Access", "partNo": 2, "paras": [[1, "(1)", "Owners and occupiers shall at all times ensure that the security and safety of other owners and occupiers and their property are preserved, and shall for this purpose:"], [2, "(a)", "ensure that upon entering or leaving the building or premises, the relevant door or gate is properly closed;"], [2, "(b)", "ensure that no unauthorised or unknown person or vehicle gain access to the building or premises via any door or gate; and"], [2, "(c)", "comply with the provisions of the site instructions and any further security measures that may be imposed by the trustees from time to time in terms of the rules or law."], [1, "(2)", "No person may tamper with or cause damage to gates, doors, CCTV cameras, fences or any other devices employed for the purpose of securing the building or controlling access."], [1, "(3)", "The security gates of sections must be kept shut after entering or exiting the section. Security gates that are left hanging open into the hallway create a risk for other persons who use the common property and cause an obstruction in a fire escape route. If the owner of the section fails to resolve this problem after three written warnings from the trustees, the body corporate may remove the security gate."], [1, "(4)", "No owner or occupier, or their visitors, contractors, employees or family members, may do anything that obstructs the security officers from effectively carrying out their duties, such as —"], [2, "(a)", "disobeying any orders or requests given by them in terms of the body corporate rules or the law;"], [2, "(b)", "verbal abuse or threats; or"], [2, "(c)", "wasting their time."], [1, "(5)", "If an owner or occupier disagrees with an order or request from a security officer, or has any issue related to the performance of security officers, they may raise their concern with the building manager or make a formal written complaint to the trustees."]]}, {"n": 13, "title": "Registration of owners, occupants and agents", "part": "Safety, Security & Access", "partNo": 2, "paras": [[1, "(1)", "In order to comply with section 13(f) of the Act, all owners must notify the body corporate of any change of ownership or occupancy of his or her section before this change occurs."], [1, "(2)", "In order to register the new owner or occupant, the notification required by sub-rule (1) must be accompanied by the relevant documentation and contact details requested by the trustees."], [1, "(3)", "An owner may also register an agent to act on his or her behalf by authorising the agent in a written notice to the trustees and specifying the extent and limitations of the agent’s authority."], [1, "(4)", "The registration of owners, occupiers or agents will only be complete once written confirmation has been received from the trustees, the building manager or the managing agent."], [1, "(5)", "Any unregistered person will be treated as visitor in accordance with conduct rule 15."]]}, {"n": 14, "title": "Access tags and codes", "part": "Safety, Security & Access", "partNo": 2, "paras": [[1, "(1)", "Each owner shall be entitled to one access tag for themself and one access tag for each section that they own. Any further access tags required must be paid for at cost price."], [1, "(2)", "Any access tag used by an unregistered or unauthorised person may be confiscated or deactivated by a security officer or the building manager and access may be denied to that person until authorisation can be established for them."], [1, "(3)", "Owners may leave an access tag in a lockbox on the premises, to be collected by their short-term tenants, agents, cleaners or contractors. In such cases the building manager must be notified in writing at least a day before the arrival of the person, accompanied by any relevant information or documentation that may be required by the trustees."], [1, "(4)", "Any lost or stolen access keys must be reported to the building manager as soon as possible so that it can be deactivated."], [1, "(5)", "The access code of the vehicle gate may only be used by —"], [2, "(a)", "the building manager;"], [2, "(b)", "owners who have a right to the exclusive use of a parking bay; or"], [2, "(c)", "a registered owner or occupier who is authorised to use an owner’s parking bay."], [1, "(6)", "The body corporate reserves the right to activate or deactivate any access tags or codes as they deem necessary to ensure the safety and security of the building."]]}, {"n": 15, "title": "Access of visitors", "part": "Safety, Security & Access", "partNo": 2, "paras": [[1, "(1)", "Any person who wishes to enter the residential portion of the building, but does not possess a valid access tag or code, and is not registered, or cannot prove that they are registered by providing valid identification, will be classified as a visitor, and may enter only if —"], [2, "(a)", "a registered person with an access tag or code accompanies them;"], [2, "(b)", "a registered person who is present in their section authorises the visitor’s entry verbally via the building’s call system; or"], [2, "(c)", "the building manager authorises their entry in accordance with sub-rule (2)."], [1, "(2)", "The building manager may authorise access to the building of —"], [2, "(a)", "employees, contractors and agents of the body corporate;"], [2, "(b)", "any person registered or authorised by an owner or agent in terms of these rules;"], [2, "(c)", "emergency personnel or government officials."], [1, "(3)", "If any visitor contravenes the rules of the body corporate or any law while on the premises, the trustees may decide to place them on a blacklist and deny them future access to the building."], [1, "(4)", "The reason(s) for placing a visitor on a blacklist must be confirmed in writing by the trustees to the owner of the section, with reference to the relevant rule or law that was contravened, and any conditions for the removal from by blacklist of the guilty party."]]}, {"n": 16, "title": "Delivery of items", "part": "Safety, Security & Access", "partNo": 2, "paras": [[1, "(1)", "No delivery person shall be allowed into the building to make a delivery to a section. The owner or occupier receiving the delivery must meet the delivery person outside the building."], [1, "(2)", "No security officer nor any other employee of the body corporate may receive items on behalf of an owner or occupier, and they may also not be held liable or responsible in any manner whatsoever for the receipt or non-receipt or the delivery or non-delivery of goods, postal matter or any other items that are delivered to the building."], [1, "(3)", "Post must be delivered to and collected from the post boxes provided in reception."], [1, "(4)", "The only exception to sub-rule (1) is the delivery or removal of furniture or building materials to or from a section. In such a case, prior arrangement must be made with the building manager and the goods lift must be used for the delivery or removal of these items."]]}, {"n": 17, "title": "Behaviour of owners, occupiers and visitors on the common property", "part": "Use of Common Property", "partNo": 3, "paras": [[1, "(1)", "An owner, occupier or visitor of a section must not —"], [2, "(a)", "without the trustees’ written consent, mark, paint, drive nails, screws or other objects into, or otherwise alter, damage or deface any part of the common property;"], [2, "(b)", "create noise or disturbance likely to interfere with the peaceful enjoyment of other persons lawfully on the premises;"], [2, "(c)", "obstruct the lawful use of the common property by any other person lawfully on the premises;"], [2, "(d)", "contravene or permit the contravention of any law, by-law, ordinance, proclamation or statutory regulation relating to or affecting the building; or"], [2, "(e)", "use his or her section, exclusive use area or any part of the common property, or permit it to be used, in a manner or for a purpose that could be injurious to the reputation of Senator Park."], [1, "(2)", "Any act of prostitution or dealing in or use of illegal drugs is prohibited in a section or on any part of the common property. Any suspected act of prostitution or dealing in or use of illegal drugs in a section or on any part of the common property must be reported to the building manager so that he or she can alert the police. The lease agreement of any occupiers suspected of such illegal conduct must be terminated on instruction from the trustees, and the occupiers responsible must be evicted by the owner of the section."], [1, "(3)", "No alcoholic beverages may be consumed on the common property."], [1, "(4)", "No smoking or vaping is allowed on any part of the common property, inside or outside."], [1, "(5)", "No explosives, crackers, fireworks or items of a similar nature may at any time be exploded, lit or operated in a section or on the common property."], [1, "(6)", "No firearms or pellet guns may be discharged in a section or on the common property, except in self-defence."], [1, "(7)", "No person may in any way overload or cause damage to a lift."], [1, "(8)", "No person may in any way damage the plants placed on the common property."], [1, "(9)", "No person may litter anywhere on the common property or throw items out of windows."], [1, "(10)", "Skateboards, bicycles, roller skates or roller blades, or other recreational propulsion items, may not be used anywhere on the common property."], [1, "(11)", "No ball games may be played on the common property."], [1, "(12)", "No hobbies or other activities which may cause a nuisance to residents may be conducted on the common property."], [1, "(13)", "Owners and occupiers must supervise their children and the children of their invitees to prevent them from causing a nuisance or endangering themselves on the common property."], [1, "(14)", "No auction, fete, jumble sale or exhibition may be held in a residential section or on the common property, without the written consent of the trustees."], [1, "(15)", "No animal may be slaughtered in any section or on any part of the common property, without the written consent of the trustees."]]}, {"n": 18, "title": "Refuse disposal and recycling", "part": "Use of Common Property", "partNo": 3, "paras": [[1, "(1)", "The occupier of a section, or their visitors, employees or contractors, must not:"], [2, "(a)", "discard or leave any waste or recycling items on any part of the common property other than inside the appropriate bins designated for waste or recycling; or"], [2, "(b)", "discard oil, paint or any hazardous substance whose correct disposal is regulated by legislation anywhere on the common property, including down a drain or toilet."], [1, "(2)", "An owner or occupier must:"], [2, "(a)", "place his or her refuse bags and recycling items inside the correct waste or recycling bin designated by the trustees in their directives or guidelines;"], [2, "(b)", "ensure that their refuse is securely wrapped in suitable, strong refuse bags, and that no refuse might drip or fall out of the bag;"], [2, "(c)", "ensure that the refuse bag or recycling items are placed inside the designated bin and that the lid is closed after disposal;"], [2, "(d)", "Notify the building manager immediately if any bins are overflowing or if another occupier left their refuse or recycling anywhere outside of the designated bins."]]}, {"n": 19, "title": "Protection devices of sections on common property", "part": "Use of Common Property", "partNo": 3, "paras": [[1, "(1)", "An owner or occupier of a section is considered to have the trustees’ consent to install a locking or safety device on the common property to protect their section against intruders, or a screen to prevent entry of animals or insects, if the device or screen is soundly built and is consistent with a design, colour, style and materials approved in writing by the trustees."], [1, "(2)", "The owner or occupier of the section must keep a device installed under sub-rule (2) in good order and repair and must pay for any future costs related to the device."]]}, {"n": 20, "title": "Appearance from outside of sections and exclusive use areas", "part": "Use of Common Property", "partNo": 3, "paras": [[1, "(1)", "The owner or occupier of a section must not, without the trustees’ written consent, make a change to the external appearance of their section, or any exclusive use area allocated to them, unless the change is minor and does not detract from the appearance of the section or the common property."], [1, "(2)", "The owner or occupier of a section must not, without the trustees’ written consent —"], [2, "(a)", "erect washing lines on the common property;"], [2, "(b)", "hang washing, laundry or other items in a section or any exclusive use area allocated to them if the articles are visible from another section or the common property, or from outside the scheme;"], [2, "(c)", "display a sign, notice, billboard or advertisement if the article is visible from another section or the common property, or from outside the scheme;"], [2, "(d)", "attach any aerial, satellite dish, air conditioner, awning or any other attachment, addition or device to or on any part of the common property; or"], [2, "(e)", "make any alterations to the front door or windows of their section."], [1, "(3)", "The written consent of the trustees granted for any item, device or alteration under sub-rule (2) may include reasonable conditions for their consent, which conditions may include specifications on the design, colour, style, materials and placement of the item, device or alteration."], [1, "(4)", "Before consenting or refusing to the request for any item, device or alteration under sub-rule (2), the trustees may request plans and/or specifications which explain the nature, design, shape, size material, colours and placement of the item, device or alteration, or request a relevant expert’s report or certification, at the cost of the owner or occupier making the request."], [1, "(5)", "If the trustees refuse the request to install a device or item under sub-rule (2), the trustees much give reasons for their refusal."]]}, {"n": 21, "title": "Exclusive use areas (parking bays and storerooms)", "part": "Use of Common Property", "partNo": 3, "paras": [[1, "(1)", "In terms of section 10(7) of the Act, the right of exclusive use of parts of the common property is hereby conferred upon members of the body corporate, being the registered owners of sections in the scheme, as stipulated hereunder."], [1, "(2)", "The parts of the common property referred to in sub-rule (1) are the areas indicated as ‘P’ (for parking bays) and ‘S’ (for storerooms) respectively and distinctively numbered on the plan annexed hereto as ‘Annexure A’, being a layout plan drawn to scale of the affected parts of the common property."], [1, "(3)", "The exclusive use areas shall be used as parking bays and storerooms respectively."], [1, "(4)", "The said exclusive use areas are allocated to the owners of sections (the linked sections) as indicated on the schedule annexed hereto as ‘Annexure B’."], [1, "(5)", "The rights vested in terms of this rule shall not be real rights; the exclusive use areas remain the property of the body corporate, unless transferred to the owner of the linked section by the registration of a notarial deed of cession in terms of sub-rule (10)."], [1, "(6)", "The owner or occupier of a linked section shall not sub-let or “sell” their exclusive use area to any other person, or use it to generate any sort of income or profit whatsoever;"], [1, "(7)", "When the linked section is transferred to a new owner, the new owner (i.e. the purchaser of the section) will automatically obtain the right of exclusive use of the parking bay(s) and/or storeroom(s) linked to that section."], [1, "(8)", "The owner of a linked section may transfer their exclusive use area back to the body corporate at any time, by sending the trustees a written notice of their request to transfer their exclusive use rights back to the body corporate, and the trustees may then accept this transfer by way of a trustee resolution and written consent to the owner, at which point the owner will lose their rights to the exclusive use of the area that was linked to their section, and they will no longer be liable for any additional levies in terms of conduct rule 27(2). The body corporate may then use the transferred exclusive use area as they see fit until the exclusive use area is linked to a new section in terms of sub-rule (9);"], [1, "(9)", "Except for the automatic transfer of an exclusive use area by the owner of a linked section to the new owner of the linked section in terms of sub-rule (7), or the transfer of an exclusive use area to the body corporate in terms of sub-rule (8), or the registration of an exclusive use area in terms of sub-rule (10) below, an exclusive use area held in terms of this rule may only be cancelled or transferred to another owner of a section in the scheme by way of a suitable amendment of the schedule annexed hereto as ‘Annexure B’, approved by the members of the body corporate at a general meeting by special resolution."], [1, "(10)", "Any exclusive use area held in terms of this rule may be transferred by the body corporate to the owner of the linked section by the registration of a notarial deed of cession entered into by the body corporate and the owner of the linked section, if the said transfer is authorised by the members of the body corporate at a general meeting by unanimous resolution."], [1, "(11)", "The owner or occupier of a linked section may only use an exclusive use area parking bay for the purpose of parking a vehicle and an exclusive use area storeroom for the purpose of storing goods or property."], [1, "(12)", "The owner or occupier of a linked section may only use their exclusive use parking bay themselves or allow it to be used by another registered owner or occupant of Senator Park, or any visitor, contractor or employee who requires parking in order to visit or work in the building."], [1, "(13)", "The owner of the linked section must keep their exclusive use area in a clean and neat condition, in terms of section 13(1)(c) of the Act;"], [1, "(14)", "The body corporate shall incur all necessary expenses related to the exclusive use areas, including repair and maintenance, but shall require the owners of the linked sections to make such additional contributions to the body corporate as is estimated to be necessary to defray the costs of these expenses, in terms of section 3(1)(c) of the Act."], [1, "(15)", "The owner or occupier of a linked section must permit the body corporate, and any persons authorised by them, access to his or her exclusive use area for any purpose reasonably required in terms of section 13(1)(c) of the Act."]]}, {"n": 22, "title": "Vehicles", "part": "Use of Common Property", "partNo": 3, "paras": [[1, "(1)", "Except in a case of emergency, no person may, without the written consent of the trustees, or the temporary consent of the building manager, park a vehicle on any part of the common property other than in a parking bay which they are authorised to use in terms of these rules."], [1, "(2)", "The trustees’ consent under sub-rule (1) must state the period for which it is given."], [1, "(3)", "The building manager’s temporary consent under sub-rule (1):"], [2, "(a)", "is valid for the period that he or she determines; but"], [2, "(b)", "may not be for a period longer than 24 hours; and"], [2, "(c)", "must not come in conflict with the exclusive use right of any owner or occupant."], [1, "(4)", "No extra-large heavy vehicle may be parked in any parking bay."], [1, "(5)", "No vehicle may be parked in a manner which obstructs the movement of pedestrians or other vehicles on the common property or which impedes the use of another parking bay."], [1, "(6)", "The trustees may cause any vehicle that is parked on the common property in a manner that is contrary to these rules to be removed or towed away, or for the wheels of the vehicle to be clamped. The trustees may determine the release fee, to be paid by the owner of the vehicle for the release of the vehicle, in order to recover the costs of the process."], [1, "(7)", "Owners and occupiers shall ensure that their vehicles, and the vehicles of their invitees, do not drip oil or brake fluid onto any parking bay or any part of the common property, or in any other way damage or deface the common property."], [1, "(8)", "No owner or occupier may dismantle or effect repairs to any vehicle on any part of the common property or in a section."], [1, "(9)", "No person may drive a vehicle on any part of the common property in a manner which is dangerous, reckless or negligent."], [1, "(10)", "No vehicle may be driven on the common property by a person who does not possess a valid license for that type of vehicle."], [1, "(11)", "No person shall use their vehicle on the common property in a manner which causes nuisance to residents. In particular —"], [2, "(a)", "music must not be hear outside of vehicles;"], [2, "(b)", "vehicle engines must not be “revved”;"], [2, "(c)", "vehicle headlights must not be on bright when on the common property; and"], [2, "(d)", "vehicle horns may not be sounded on the common property, except in the event of an immediate or imminent danger or in an emergency."], [1, "(12)", "No person may sleep in or reside in a vehicle parked on any part of the common property, which includes any parking bays."]]}, {"n": 23, "title": "Behaviour of owners, occupiers and visitors in sections", "part": "Use of Sections", "partNo": 4, "paras": [[1, "(1)", "An owner or occupier of a section may not —"], [2, "(a)", "use a section or exclusive use area, or permit it to be used, in a manner or for a purpose which may cause a nuisance, in breach of section 13(1)(e) of the Act;"], [2, "(b)", "subject to the provisions of section 13(1)(g) of the Act, use a section or exclusive use area for a purpose other than its intended use as —"], [3, "(i)", "shown expressly or by implication on a registered sectional plan or an approved building plan;"], [3, "(ii)", "can reasonably be inferred from the provisions of the applicable town planning by-laws or the rules of the body corporate;"], [3, "(iii)", "is obvious from its construction, layout and available amenities."], [2, "(c)", "contravene the provisions of any law or by-law or the conditions of title or of a license relating to the use of their section or exclusive use area;"], [2, "(d)", "make alterations to a section or an exclusive use area that are likely to impair the stability of the building or interfere with the use and enjoyment of other sections, the common property or any exclusive use area; or"], [2, "(e)", "do anything to a section or exclusive use area or use it in a manner that has a material negative effect on the value or utility of any other section or exclusive use area, or which may be injurious to the reputation of Senator Park."], [2, "(f)", "let or sub-let a residential section for a period of less than 2 nights; or"], [2, "(g)", "permit more than 2 adults to occupy a residential section."], [1, "(2)", "Owners and occupiers must specifically between the hours of 23h00 and 08h00 maintain quietness in their sections and on the common property, and on Sundays and public holidays no undue noise or disturbance may be caused at any time of the day."], [1, "(3)", "All radios, televisions, stereo systems, laptops and other appliances emitting sound must be kept at audio levels which are reasonable, in the discretion of the trustees or the building manager, at all times."]]}, {"n": 24, "title": "Keeping of animals", "part": "Use of Sections", "partNo": 4, "paras": [[1, "(1)", "The owner or occupier of a section must not keep any animal in a section or on the common property, except in terms of sub-rule (2)."], [1, "(2)", "An owner or occupier suffering from a disability, and who requires a guide, hearing or assistance dog are allowed to keep that animal in a section and to accompany it on the common property."], [1, "(3)", "The owner of a guide, hearing or assistance dog, as contemplated in sub-rule (2), must notify the trustees of the dog’s residence in the building and provide the trustees with a copy of the dog’s relevant qualification."], [1, "(4)", "The feeding of wild animals, including birds, anywhere on the building premises is prohibited."]]}, {"n": 25, "title": "Eradication of pests", "part": "Use of Sections", "partNo": 4, "paras": [[1, "(1)", "The owner of a section must keep their section free of rats, mice, cockroaches, white ants, borer beetles and other wood-destroying insects."], [1, "(2)", "The owner or occupier of a section must allow the trustees, the managing agent, or their duly authorised representatives to enter the section on reasonable notice to inspect it and take any action reasonably necessary to eradicate any such pests and replace damaged woodwork and other materials."], [1, "(3)", "The body corporate must recover the costs of the inspection and replacement referred to in sub-rule (2) from the owner of the section."]]}, {"n": 26, "title": "Renovations & alterations to sections", "part": "Use of Sections", "partNo": 4, "paras": [[1, "(1)", "In respect of all renovations or alteration work under this rule, an owner or occupier must —"], [2, "(a)", "abstain from commencing with any renovations or alteration work until written consent has been obtained from the trustees in terms of sub-rule (3);"], [2, "(b)", "comply with the relevant provisions of these rules and of the guidelines and/or the conditions prescribed by the trustees or by the body corporate;"], [2, "(c)", "ensure that his or her contractors and/or other workers comply with the provisions of these rules and any conditions prescribed by the trustees;"], [2, "(d)", "where applicable, comply with any requirements of the Local Authority and with the National Building Regulations and Building Standards Act, no. 103 of 1977, as amended, and any other legislation or statutory regulations;"], [2, "(e)", "engage suitably qualified contractors, especially in respect of plumbing-, electrical- and waterproofing-work, and, in respect of structural alterations, suitably qualified architects, builders and/or structural engineers;"], [2, "(f)", "make all reasonable provisions for fire prevention and ensure that the safety of other residents is never compromised;"], [2, "(g)", "ensure that the harmonious appearance of the building is not compromised;"], [2, "(h)", "ensure that the common property is kept clean, tidy and free of building rubble, which must be removed as work proceeds;"], [2, "(i)", "only use the electricity supply of the body corporate with the consent of the trustees and subject to payment of the costs of such usage;"], [2, "(j)", "ensure the work is performed with the minimum of discomfort, disturbance, obstruction or nuisance to other residents and is completed within the timeframe specified by the trustees (if any);"], [2, "(k)", "ensure that only the goods lift and adjoining goods lift stairs are used; and"], [2, "(l)", "ensure that contractors and/or other workers do not enter the building premises before 09h00 and that they are off of the building premises by 17h00, and that they do not work on Saturdays, Sundays or public holidays, except to conduct emergency repairs or urgent preventative work."], [1, "(2)", "An owner or occupier of a section must obtain the written consent of the trustees before commencing with any renovations or alteration work to their section which will involve —"], [2, "(a)", "any noise, nuisance, vibration or other disturbance (such as prolonged hammering, drilling, sawing, sanding, scraping, etc. or movement of heavy items or machinery);"], [2, "(b)", "any structural alterations (such as breaking or drilling into walls, ceilings or floors);"], [2, "(c)", "any structural additions inside a section (such as building an additional wall);"], [2, "(d)", "any alterations to the pipes, wires, cables or ducts inside a section which are connected to the common property or to another section;"], [2, "(e)", "any major plumbing installations (such as bathtubs, showers, toilets, sinks, etc.);"], [2, "(f)", "any gas installations; or"], [2, "(g)", "any alterations visible from outside the building or from the common property."], [1, "(3)", "In order to proceed with any renovations or alteration work listed under sub-rule (2), an owner, or a registered occupier or agent authorised by the owner, must first submit a written request to the trustees, together with specifications of the proposed work, a time frame, and, if applicable, a sketch or building plan of the proposed work."], [1, "(4)", "The trustees may only grant their written consent once they have established that the proposed work does not contravene any relevant laws or any rules of the body corporate, and the trustees may attach any conditions to their consent to ensure that the work is done within the confines of any relevant laws and the rules of the body corporate."], [1, "(5)", "The trustees may not consent to any alterations which require the authorisation of the members of the body corporate in terms of the Act or the management rules."], [1, "(6)", "The trustees must convey their written consent or refusal to the request received in terms of sub-rule (3) within fourteen (14) days of receipt, and they must state clearly their conditions for consent or their reasons for refusal."], [1, "(7)", "In the case of structural alterations or structural additions, the trustees may —"], [2, "(a)", "require the owner to furnish them with a report by a structural engineer advising that the proposed structural changes will not detrimentally affect the structural integrity of the building;"], [2, "(b)", "consult with an architect, engineer, legal advisor or other professional consultant regarding the proposed structural changes, and recover the costs of the consultation from the owner of the section provided that the consultation is arranged with his or her prior knowledge and approval;"], [2, "(c)", "require the owner, where applicable, to furnish them with a copy of the building plans approved by the Local Authority;"], [2, "(d)", "require the owner to pay a deposit to the body corporate to cover the body corporate should any damage occur to the common property or to another section during construction, or should there be any necessary expenditure by the body corporate as a result of the construction;"], [2, "(e)", "require the owner to pay a scrutiny fee to the body corporate; and/or"], [2, "(f)", "require the owner or his or her contractors to provide evidence that they have taken out appropriate insurance for the duration of construction."], [1, "(8)", "A deposit paid to the body corporate in terms of sub-rule (7)(d) shall be refunded to the owner, without interest, subject to any deductions that may be made for costs and damages in terms of these rules, once the trustees are satisfied that the work is completed."], [1, "(9)", "The owner of the section accepts responsibility, and shall be liable to the body corporate (or to other owners, as the case may be), for any damage caused by him or her, or by his or her contractors or other workers, to the common property or to other sections, and indemnifies the body corporate against any such damage or any claims arising therefrom."], [1, "(10)", "If an owner, or his or her contractors or other workers, damage the common property during the alteration process, the trustees may appoint an independent contractor to repair the damage and recover the costs of repairs from the applicable owner. The trustees may also utilise the deposit paid by the owner, if any, to defray the costs of repairs."], [1, "(11)", "Should any work commence before the trustees have granted their written consent, or should the scope of the work be materially changed, the trustees may instruct the owner or his or her contractors to stop the work, until permission to continue with the work has been granted by the trustees."]]}, {"n": 27, "title": "Levies of the body corporate", "part": "Financial Obligations of Owners", "partNo": 5, "paras": [[1, "(1)", "In terms of section 3(1)(c) of the Act, the owner of each section in the scheme is hereby required to make monthly contributions to the administrative and reserve funds of the body corporate, which contribution must reach the designated body corporate bank account no later than the first (1st) day of every calendar month."], [1, "(2)", "In terms of section 3(1)(c) of the Act, the owner of each section which is entitled to the right of exclusive use of a part or parts of the common property, as conferred by conduct rule 21, is hereby required to make additional monthly contributions to the funds as is estimated necessary to defray the costs of rates and taxes, insurance and maintenance in respect of any such part or parts, including the provision of electricity and water. These additional contributions must also reach the designated body corporate bank account no later than the first (1st) day of every calendar month."], [1, "(3)", "In terms of section 3(1)(e) of the Act, the total monthly and/or yearly amounts to be raised for the administrative and reserve funds of the body corporate shall be determined by the owners at a general meeting on approval of the scheme’s budget(s)."], [1, "(4)", "In terms of section 3(1)(f) of the Act, the monthly and/or yearly contribution payable by each section’s owner(s) shall be calculated by applying each section’s participation quota, as determined by management rule 26(2), to the total monthly and/or yearly amounts determined by the owners in terms of sub-rule (3)."], [1, "(5)", "In terms of section 3(2) of the Act, liability for contributions levied under any provision of section 3(1) of the Act accrues from the passing of a resolution to that effect by the trustees of the body corporate. Provided that upon the change of ownership of a unit, the successor in title becomes liable for the pro rata payment of such contributions from the date of change of such ownership."], [1, "(6)", "The trustees must, within 14 days after the approval of the budget(s) at a general meeting, provide the owner(s) of each section with written notice of the contributions and charges due and payable by that member to the body corporate, in compliance with management rule 26(1) and section 3(5) of the Act."], [1, "(7)", "Until a new resolution is passed by the trustees in terms of sub-rule (5), and a new written notice is sent to owners in terms of sub-rule (6), all owners remain liable for contributions in the same amounts and payable by the same dates as were due and payable by them since the last trustees resolution and written notice was made and sent in terms of sub-rules (5) and (6)."], [1, "(8)", "Any special contributions deemed necessary by the trustees must be raised in terms of sections 3(3) and 3(4) of the Act and management rule 22(3)(a), and any increase in contributions at the end of a financial year which is deemed necessary by the trustees must be raised in terms of management rule 22(3)(b)."], [1, "(9)", "No discount or reduction of the contributions of owners may be effected or allowed by the trustees under any circumstances. The contribution amounts levied on the owner of each section may only be determined by following the procedures stipulated in sub-rules (3) and (4), or in the event of a special contribution or increase in terms of sub-rule (8)."]]}, {"n": 28, "title": "Levies of the Community Schemes Ombud Service (CSOS)", "part": "Financial Obligations of Owners", "partNo": 5, "paras": [[1, "(1)", "The owner of each section must contribute to the levies payable by the scheme to the CSOS, in terms of the Regulations on the Community Schemes Ombud Service, 2016."], [1, "(2)", "The contribution amount of each section to the CSOS levy shall be added to the monthly levy statement of all owners, and this amount must be paid to the body corporate no later than the first (1st) day of every calendar month."]]}, {"n": 29, "title": "Electricity charges", "part": "Financial Obligations of Owners", "partNo": 5, "paras": [[1, "(1)", "All owners who do not make use of a pre-paid electricity meter must make a monthly payment to the body corporate for the electricity consumed by their section."], [1, "(2)", "The monthly amount contemplated in sub-rule (1) will be determined by the readings of the electricity meter connected to the section."], [1, "(3)", "The amount due by the owner for the electricity consumed by his or her section shall be added to the monthly levy statement sent to them, and this amount must be paid to the body corporate no later than the first (1st) day of every calendar month."]]}, {"n": 30, "title": "Arrears procedure and liability for legal costs", "part": "Financial Obligations of Owners", "partNo": 5, "paras": [[1, "(1)", "If the body corporate does not receive the full amount of levies and charges due by an owner by the first (1st) day of the calendar month, a final notice shall be sent to the owner on the second (2nd) day of the month, in terms of management rule 26(3)."], [1, "(2)", "If payment for the arrears amount is still not received by the body corporate within 14 days of the final notice being delivered to the owner, the full amount of contributions due by the owner for the remainder of the financial year will become due and payable immediately, including any interest that the trustees may decide to charge on the arrears amount in terms of (X), and the case will be handed over to an attorney for collection."], [1, "(3)", "An owner is liable for all reasonable legal costs incurred by the body corporate in the collection of arrear contributions or any other arrear amounts due and owing by the owner to the body corporate."]]}], "management": [{"n": 1, "title": "Heading", "part": "Introductory", "partNo": 1, "paras": [[1, "", "Management rules as prescribed, with amendments and additions, in terms of section 10(2)(a) of the Sectional Titles Schemes Management Act, 2011 (Act No. 8 of 2011)."]]}, {"n": 2, "title": "Interpretation", "part": "Introductory", "partNo": 1, "paras": [[1, "(1)", "In the interpretation of these rules, unless the context indicates otherwise —"], [2, "(a)", "“adjudicator” means an adjudicator acting in terms of the Community Schemes Ombud Service Act, 2011 (Act No. 9 of 2011);"], [2, "(b)", "“administrator” means an administrator appointed in terms of section 16 of the Act;"], [2, "(c)", "“auditor” means a person accredited to perform an audit in terms of the Auditing Professions Act, 2005 (Act No. 26 of 2005);"], [2, "(d)", "“Community Schemes Ombud Service” means the service established in terms of the Community Scheme Ombud Service Act, 2011 (Act No. 9 of 2011);"], [2, "(e)", "“estimated cost”, for the purposes of rule 24, means the estimated cost to maintain, repair or replace a major capital item;"], [2, "(f)", "“expected life”, for the purposes of rule 24, means the estimated number of years before it is expected that the cost of maintenance, repair or replacement of a major capital item will be incurred;"], [2, "(g)", "“future development right” means a right to extend the scheme in terms of section 25 of the Sectional Titles Act;"], [2, "(h)", "“major capital item”, for the purposes of rule 24, means wiring, lighting and electrical systems, plumbing, drainage and storm- water systems, heating and cooling systems, any lifts, any carpeting and furnishings, roofing, interior and exterior painting and waterproofing, communication and service supply systems, parking facilities, roadways and paved areas, security systems and facilities and any other community and recreational facilities;"], [2, "(i)", "“managing agent” means any person who provides scheme management services to a body corporate for reward, whether monetary or otherwise, including any person who is employed to render such services;"], [2, "(j)", "“member” means a member of the body corporate;"], [2, "(k)", "“past contribution”, for the purposes of rule 24, means the funds in the reserve fund of the body corporate in respect of the estimated cost;"], [2, "(l)", "“primary section” means a section designed to be used for human occupation as a residence, office, shop, factory or for any other type of use allowed in terms of local municipal by-laws, not being a utility section;"], [2, "(m)", "“registered auditor” means a person as defined in terms of the Auditing Professions Act, 2005 (Act No. 26 of 2005);"], [2, "(n)", "“registered bondholder” means the holder of a mortgage bond of whom the body corporate has been notified in terms of section 13(1)(f) of the Act;"], [2, "(o)", "“reserve funds” means an amount set aside by the body corporate to meet the unexpected costs that may arise in future, including future cost of maintenance;"], [2, "(p)", "“Sectional Titles Act” means the Sectional Titles Act, 1986, (Act No. 95 of 1986), as amended;"], [2, "(q)", "“service address” means the service address of a member or the body corporate in terms of rule 4; and"], [2, "(r)", "“the Act” means the Sectional Titles Schemes Management Act 8 of 2011;"], [2, "(s)", "“the Regulations” means the Sectional Titles Schemes Management Regulations, 2016;"], [2, "(t)", "“utility section” means a section which, in terms of local municipality bylaws, is designed to be used as an accessory to a primary section, such as a bathroom, toilet, storeroom, workshop, shed, servant’s quarters, parking garage, parking bay or other utility area, not being a primary section."], [1, "(2)", "In the interpretation of these rules —"], [2, "(a)", "words and expressions to which a meaning has been assigned in the Act or its regulations, bear those meanings;"], [2, "(b)", "words importing —"], [3, "(i)", "the singular must be interpreted to include the plural, and the plural to include the singular; and"], [3, "(ii)", "any one gender must be interpreted to include all other genders; and"], [2, "(c)", "the headings of rules must not be taken into account."]]}, {"n": 3, "title": "Amendment and binding nature", "part": "Introductory", "partNo": 1, "paras": [[1, "(1)", "The body corporate may substitute, amend, repeal, or add to the management rules subject to and in accordance with the provisions of section 10 of the Act."], [1, "(2)", "A member must take all reasonable steps to ensure compliance with the conduct rules in force in terms of section 10(2)(b) of the Act by any tenant or other occupant of any section or exclusive use area, including the member’s employees, guests, visitors and family members."]]}, {"n": 4, "title": "Service addresses", "part": "Introductory", "partNo": 1, "paras": [[1, "(1)", "The body corporate must, from time to time, determine the address that is its domicilium citandi et executandi in terms of section 3(1)(o) of the Act; provided that such service address must be—"], [2, "(a)", "the physical address of a section in the scheme;"], [2, "(b)", "the physical address of a duly appointed managing agent or administrator; or"], [2, "(c)", "another physical address within the magisterial district in which the scheme is located."], [1, "(2)", "The trustees may designate a fax, email or other address as an alternate body corporate service address."], [1, "(3)", "A change of a body corporate service address is effective when written notice of that address is lodged with the Community Schemes Ombud Service in the prescribed form."], [1, "(4)", "The trustees must, when they give the Community Schemes Ombud Service notice of a change of the body corporate service address in terms of section 3(1)(o) of the Act, simultaneously give such written notice to all members and other occupiers of sections and to all registered bondholders."], [1, "(5)", "The service address for any legal process or delivery of any other document to a member is the address of the primary section registered in that member’s name; provided that a member is entitled by written notice to the body corporate to change that address for purposes as contemplated in subsections 6(3)(c) and 6(4) of the Act to another physical address, postal address or fax in the Republic of South Africa or to an email address, and that the change in the service address of the member is effective when the body corporate receives notice of such a change."], [1, "(6)", "The service address for any legal process or delivery of any other document to an occupier of a section, who is not a member, is the physical address of that section."]]}, {"n": 5, "title": "Fiduciary position of trustees", "part": "Trustees", "partNo": 2, "paras": [[1, "(1)", "In terms of section 8 of the Act, the trustees of the body corporate must —"], [2, "(a)", "act honestly and in good faith in relation to the body corporate, and in particular —"], [3, "(i)", "exercise his or her powers in terms of the Act in the interest and for the benefit of the body corporate; and"], [3, "(ii)", "not act without or exceed those powers; and"], [2, "(b)", "must avoid any material conflict between his or her own interests and those of the body corporate, and in particular —"], [3, "(i)", "not receive any personal economic benefit, direct or indirect, from the body corporate or from any other person; and"], [3, "(ii)", "as soon as they become aware of any direct or indirect material interest which he or she may have in any contract of the body corporate, notify every trustee of the nature and extent of this."], [1, "(2)", "A trustee who acts in breach of his or her fiduciary relationship, is liable to the body corporate for —"], [2, "(a)", "any loss suffered as a result thereof by the body corporate; or"], [2, "(b)", "any economic benefit received by the trustee by reason thereof."]]}, {"n": 6, "title": "Fundamental obligations of trustees", "part": "Trustees", "partNo": 2, "paras": [[1, "(1)", "In terms of regulation 14 of the Regulations on the Community Schemes Ombud Service, 2016, the trustees of the body corporate must —"], [2, "(a)", "take reasonable steps to inform and educate himself or herself about the scheme, its affairs and activities and the legislation, rules and other governance documentation in terms of which the scheme must operate;"], [2, "(b)", "take reasonable steps to obtain sufficient information and advice about all matters to be decided by the trustees in order to make conscientious and informed decisions;"], [2, "(c)", "unless excused by the chairperson of the trustees on reasonable grounds —"], [3, "(i)", "attend all meetings of the trustees; and"], [3, "(ii)", "attend the body corporate’s annual general meeting, if it holds such a meeting;"], [2, "(d)", "exercise an active and independent opinion with respect to all matters to be decided by the trustees; and"], [2, "(e)", "exercise due diligence in relation to any business of, and necessary preparation for and attendance at meetings of, the trustees or any committee or project to which such trustee is appointed."], [1, "(2)", "The obligations of a trustee in terms of sub-rule (1) are in addition to and do not derogate from the fiduciary obligations of a trustee in terms of the common law, section 8 of the Act or any other applicable statute."]]}, {"n": 7, "title": "Requirements for office and disqualification", "part": "Trustees", "partNo": 2, "paras": [[1, "(1)", "A trustee need not be a member or the legally recognised representative of a member who is a juristic person."], [1, "(2)", "A person who is the managing agent or an employee of the managing agent or the body corporate may not be a trustee unless that person is a member."], [1, "(3)", "A trustee who has any direct or indirect personal interest in any matter to be considered by the trustees must not be present at or play any part in the consideration or decision of the matter concerned."], [1, "(4)", "A trustee ceases to hold office if that trustee —"], [2, "(a)", "by written notice to the body corporate, resigns from office;"], [2, "(b)", "is declared by a court to be of unsound mind;"], [2, "(c)", "is or becomes insolvent and the insolvency results in the sequestration of that trustee’s estate;"], [2, "(d)", "is convicted, or has been convicted in the Republic or elsewhere, of theft, fraud, forgery, perjury or any other offence involving dishonesty;"], [2, "(e)", "is sentenced to imprisonment without the option of a fine;"], [2, "(f)", "is removed from an office of trust on account of misconduct in respect of fraud or the misappropriation of money;"], [2, "(g)", "is removed from office by ordinary resolution of a general meeting; provided the intention to vote on the proposed removal was specified in the notice convening the meeting;"], [2, "(h)", "is or becomes disqualified to hold office as a director of a company in terms of the Companies Act, 2008 (Act No. 71 of 2008); or"], [2, "(i)", "fails or refuses to pay the body corporate any amount due by that trustee after a court or adjudicator has given a judgment or order for payment of that amount."]]}, {"n": 8, "title": "Nomination, election and replacement", "part": "Trustees", "partNo": 2, "paras": [[1, "(1)", "A member may nominate any person who is qualified in terms of rule 7 for the office of trustee."], [1, "(2)", "The nomination of a trustee must be in writing, accompanied by the written consent of the person nominated, and be delivered to the body corporate service address or the e-mail address specified in the annual general meeting notice at least 48 hours before the annual general meeting is due to start."], [1, "(3)", "If an insufficient number of nominations are received in terms of sub-rule (2), further nominations may be called for at the annual general meeting with the consent of the persons nominated."], [1, "(4)", "The number of trustees determined at the annual general meeting must be at least 5 trustees."], [1, "(5)", "One of the trustees must be the owner of the commercial section, unless the owner of the commercial section waives this right until the next annual general meeting, or unless they cease to hold office as a trustee in terms of rule 7(4)."], [1, "(6)", "If a trustee ceases to hold office —"], [2, "(a)", "the remaining trustees; or"], [2, "(b)", "the members in general meeting, must appoint a replacement trustee within 60 days of the vacancy occurring."], [1, "(7)", "An elected or replacement trustee holds office until the end of the next annual general meeting and is eligible for re-election, if properly nominated."], [1, "(8)", "The trustees may appoint, for a specified period, a person qualified to serve as a trustee in terms of rule 6 as a replacement for any trustee who is absent or otherwise unable to perform the duties of that office."]]}, {"n": 9, "title": "Payment and indemnity", "part": "Trustees", "partNo": 2, "paras": [[1, "(1)", "The body corporate must reimburse trustees for all disbursements and expenses actually and reasonably incurred by them in carrying out their duties and exercising their powers."], [1, "(2)", "Unless so determined by special resolution, trustees who are members are not entitled to any reward, whether monetary or otherwise, for their services as such."], [1, "(3)", "Trustees who are not members may be rewarded for their services as such; provided that any reward, whether monetary or otherwise, must be approved by a resolution of the body corporate as part of the budget for the scheme’s administrative fund."], [1, "(4)", "The body corporate must indemnify a trustee who is not a managing agent against all costs, losses and expenses arising as a result of any official act that is not in breach of the trustee’s fiduciary obligations to the body corporate."]]}, {"n": 10, "title": "General powers and duties", "part": "Trustee Meetings and Decisions", "partNo": 3, "paras": [[1, "", "The trustees must —"], [2, "(a)", "meet to carry out the body corporate’s business, adjourn and otherwise regulate their meetings as they think fit, subject to the provisions of the Act, these rules and the common law of meetings;"], [2, "(b)", "exercise the body corporate’s powers and functions assigned and delegated to them in terms of section 7(1) of the Act in accordance with resolutions taken at general meetings and at meetings of trustees;"], [2, "(c)", "apply the body corporate’s funds in accordance with budgets approved by members in general meeting;"], [2, "(d)", "appoint any agent or employee in terms of section 4(a) of the Act in terms of a duly signed written contract; and"], [2, "(e)", "compile minutes of each trustee and general meeting in accordance with rule 29(2)(a) and distribute these to the persons entitled to notice of the meeting concerned as soon as reasonably possible, but not later than 7 days after the date of the meeting."]]}, {"n": 11, "title": "Validity of actions", "part": "Trustee Meetings and Decisions", "partNo": 3, "paras": [[1, "(1)", "No document signed on behalf of the body corporate is valid and binding unless it is signed on the authority of a trustee resolution by —"], [2, "(a)", "two trustees or the managing agent, in the case of a clearance certificate issued by the body corporate in terms of section 15B(3)(i) (aa) of the Sectional Titles Act; and"], [2, "(b)", "two trustees or one trustee and the managing agent, in the case of any other document."], [1, "(2)", "A resolution adopted or other act performed by the trustees remains valid and effective notwithstanding the later discovery of some defect in the appointment of a trustee or the disqualification of a trustee."]]}, {"n": 12, "title": "Calling and attendance of meetings", "part": "Trustee Meetings and Decisions", "partNo": 3, "paras": [[1, "(1)", "A trustee may at any time call a meeting of trustees by giving all other trustees not less than seven days written notice of the time and place of the meeting and by setting out an agenda for the meeting: Provided that —"], [2, "(a)", "in cases of urgency a trustee may give such shorter notice as is reasonable in the circumstances; and"], [2, "(b)", "notice need not be given to any trustee who is absent from the Republic unless the meeting is one referred to in sub-rule (5), but notice must be given to any replacement trustee appointed for that trustee."], [1, "(2)", "The trustees may by written resolution set the dates of and a standard agenda for their future meetings and delivery of a copy of this resolution is considered adequate notice of all such future meetings."], [1, "(3)", "The trustees must meet on a monthly basis."], [1, "(4)", "Members, registered bondholders, holders of future development rights and the managing agent may attend trustee meetings and may speak on any matter on the agenda, but they are not entitled to propose any motion or to vote; provided that such persons are not entitled to attend those parts of trustee meetings that deal with —"], [2, "(a)", "discussions of contraventions of the Act or rules; or"], [2, "(b)", "any other matters in respect of which the trustees resolve that the presence of any such persons would unreasonably interfere with the interests of the body corporate or any person’s privacy."], [1, "(5)", "If a member, a registered mortgagee or the holder of a future development right in writing requests notice of trustee meetings, the trustees must deliver to that person a copy of a notice of a meeting referred to in sub-rule (1), a resolution referred to in sub-rule (2) and a notice of any adjournment of such a meeting; provided that the body corporate may recover from the person concerned the costs of delivery of such documents."], [1, "(6)", "The trustees may make arrangements for attendance at a trustee meeting by telephone or any other method, if the method —"], [2, "(a)", "is accessible to all trustees and other persons entitled to attend the meeting;"], [2, "(b)", "permits all persons participating in the meeting to communicate with each other during the meeting; and"], [2, "(c)", "permits the chairperson to confirm, with reasonable certainty, the identity of the participants."], [1, "(7)", "A person who attends a meeting as provided under sub-rule (6) is considered present in person at the meeting."]]}, {"n": 13, "title": "Chairperson", "part": "Trustee Meetings and Decisions", "partNo": 3, "paras": [[1, "(1)", "At the commencement of the first meeting of trustees after an annual general meeting at which trustees have been elected and whenever else necessary, the trustees must by majority vote elect a chairperson from among their number."], [1, "(2)", "The chairperson of the trustees holds office as such until the end of the next annual general meeting."], [1, "(3)", "The trustees at a trustees’ meeting or the members at a general meeting may remove the chairperson from office if notice of the meeting contains a clear statement of the proposed removal; provided that such removal does not automatically remove the chairperson from the office of trustee."], [1, "(4)", "If a chairperson is removed from office as such or ceases to hold office as a trustee, the remaining trustees must elect a replacement chairperson from among their number who holds office as chairperson for the remainder of the period of office of his or her predecessor and has the same voting rights."], [1, "(5)", "If the elected chairperson vacates the chair during the course of a trustee meeting, is not present or is for any other reason unable or unwilling to preside, the trustees present must choose another chairpe

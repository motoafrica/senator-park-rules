        <span class="bg-slate-800 text-blue-300 text-xs px-3 py-1 rounded-full border border-slate-700">CSOS Approved</span>
        <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">Print / Save PDF</button>
      </div>
    </div>
  </header>
